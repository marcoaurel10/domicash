<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3C3489">
<title>Domicash</title>
<style>
/* v1.24 (visual novo): cores revistas. --inbg = fundo dos campos, --sh = sombra leve dos cartões, --acc = verde-menta do progresso */
:root{--pri:#5B4FD6;--pri-d:#4436B8;--pri-l:#EEECFD;--pri-tx:#4B3FC4;--hdr:#3C3489;--hdr-bd:transparent;--hdrtx:#fff;--bg:#F4F3F8;--card:#fff;--surf:#fff;--inbg:#F2F1F7;--tx:#17161C;--tx2:#6E6C78;--bd:#ECEAF2;--inbd:#DCD9E6;--ok:#0F7E51;--ok-l:#E3F6EE;--ok-bd:#8FD9B8;--bad:#D23F58;--bad-l:#FDECEF;--bad-bd:#F3A6B3;--grid:#E2E0EA;--ctx:#3d3b48;--toast:#1d1b29;--acc:#2FD4A0;--sh:0 1px 2px rgba(25,18,70,.05),0 6px 18px rgba(25,18,70,.05);color-scheme:light}
html[data-tema=escuro]{--pri:#7B70F0;--pri-d:#5B4FD6;--pri-l:#272345;--pri-tx:#CFCBFF;--hdr:#2A2463;--bg:#0F0E14;--card:#1A1922;--surf:#1A1922;--inbg:#14131B;--tx:#F3F2F8;--tx2:#A3A1B0;--bd:#2A2933;--inbd:#3A3946;--ok:#3FD69A;--ok-l:#123528;--ok-bd:#1E6B4C;--bad:#FF7A90;--bad-l:#3a1a22;--bad-bd:#7a2a3a;--grid:#34333f;--ctx:#d6d4e0;--toast:#2b2938;--sh:none;color-scheme:dark}
html[data-tema=black]{--pri:#7B70F0;--pri-d:#5B4FD6;--pri-l:#1d1a3d;--pri-tx:#CFCBFF;--hdr:#1B173F;--hdr-bd:#222;--bg:#000;--card:#0E0E13;--surf:#0E0E13;--inbg:#08080b;--tx:#F3F2F8;--tx2:#9d9ba8;--bd:#22212a;--inbd:#36353f;--ok:#3FD69A;--ok-l:#0f2a20;--ok-bd:#1E6B4C;--bad:#FF7A90;--bad-l:#2a1018;--bad-bd:#7a2a3a;--grid:#2c2b34;--ctx:#d6d4e0;--toast:#26252f;--sh:none;color-scheme:dark}
html[data-tema=suave]{--pri:#5B4FD6;--pri-d:#4436B8;--pri-l:#E6E3FA;--pri-tx:#4B3FC4;--hdr:#3C3489;--hdr-bd:transparent;--bg:#ECEAE4;--card:#FAF9F5;--surf:#FAF9F5;--inbg:#EFEDE6;--tx:#17161C;--tx2:#64626b;--bd:#E2DFD6;--inbd:#CFCBC0;--ok:#0F7E51;--ok-l:#DFF1E8;--ok-bd:#8FD9B8;--bad:#D23F58;--bad-l:#F8E4E7;--bad-bd:#EBA0AC;--grid:#d6d3ca;--ctx:#3d3b48;--toast:#1d1b29;color-scheme:light}
html[data-tema=areia]{--pri:#5B4FD6;--pri-d:#4436B8;--pri-l:#E9E4F7;--pri-tx:#4B3FA8;--hdr:#2F2A54;--hdr-bd:transparent;--bg:#EFE8DC;--card:#FCF8F1;--surf:#FCF8F1;--inbg:#F3ECE0;--tx:#2A251E;--tx2:#6E6457;--bd:#E4DACA;--inbd:#CFC2AE;--ok:#0F7E51;--ok-l:#E3EFE2;--ok-bd:#8FD9B8;--bad:#D23F58;--bad-l:#F7E3DD;--bad-bd:#E9A3A0;--grid:#d6cbb8;--ctx:#4a4237;--toast:#2C2C2A;color-scheme:light}
html[data-tema=grafite]{--pri:#7B70F0;--pri-d:#5B4FD6;--pri-l:#262250;--pri-tx:#D4D1FA;--hdr:#211C4D;--hdr-bd:#2A2A31;--bg:#0B0B0E;--card:#17171C;--surf:#17171C;--inbg:#101014;--tx:#F3F2F8;--tx2:#A9A7B0;--bd:#2A2A33;--inbd:#44444f;--ok:#3FD69A;--ok-l:#11281f;--ok-bd:#1E6B4C;--bad:#FF7A90;--bad-l:#2E1419;--bad-bd:#7a2a3a;--grid:#34343e;--ctx:#d6d4e0;--toast:#2a2a33;--sh:none;color-scheme:dark}
html[data-tema=azul]{--pri:#7B70F0;--pri-d:#5B4FD6;--pri-l:#272552;--pri-tx:#D4D1FA;--hdr:#1E2A5C;--hdr-bd:#232B44;--bg:#0D1222;--card:#161D31;--surf:#161D31;--inbg:#0f1527;--tx:#EEF0F6;--tx2:#9BA3B8;--bd:#243049;--inbd:#3A4566;--ok:#3FD69A;--ok-l:#10291f;--ok-bd:#1E6B4C;--bad:#FF7A90;--bad-l:#2c1520;--bad-bd:#7a2a3a;--grid:#2f3955;--ctx:#D3D8E4;--toast:#242c45;--sh:none;color-scheme:dark}
/* Barra superior: verde do ícone (padrão, tom ajustado ao tema), roxo ou cor do tema */
html[data-barra=verde]{--hdr:#2E6B3A;--hdr-bd:transparent}
html[data-barra=verde][data-tema=escuro]{--hdr:#225530}
html[data-barra=verde][data-tema=grafite],html[data-barra=verde][data-tema=azul]{--hdr:#1C4626;--hdr-bd:#2a5a35}
html[data-barra=verde][data-tema=black]{--hdr:#133A1C;--hdr-bd:#1f4d29}
html[data-barra=roxo]{--hdr:#3C3489;--hdr-bd:transparent}
html[data-barra=roxo][data-tema=escuro],html[data-barra=roxo][data-tema=grafite],html[data-barra=roxo][data-tema=azul]{--hdr:#26215C}
html[data-barra=roxo][data-tema=black]{--hdr:#1d1a3d;--hdr-bd:#2b2752}
html[data-barra=neutra]{--hdr:var(--card);--hdr-bd:var(--bd);--hdrtx:var(--tx)}
html[data-barra=neutra] header,html[data-barra=neutra] header button{color:var(--tx)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Manrope",system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-size:16px;font-variant-numeric:tabular-nums}
svg.i{display:inline-block;vertical-align:-3px;flex:none}
header{background:var(--hdr);border-bottom:1px solid var(--hdr-bd);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;font-weight:600;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;display:flex}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header .hb{width:44px;height:44px;margin:-6px 0 -6px -8px;border-radius:12px;align-items:center;justify-content:center;position:relative}
header .hb:active{background:rgba(255,255,255,.12)}
header .ponto{position:absolute;top:8px;right:7px;width:9px;height:9px;border-radius:50%;background:#E24B4A;border:2px solid var(--hdr)}
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;border:0;display:flex;align-items:center;justify-content:center;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.fab:active{transform:scale(.96)}
.fab{transition:transform .25s ease}
.fab.escondido{transform:translateY(140px)}
.gaveta{position:fixed;inset:0;z-index:40;pointer-events:none}
.gaveta .fundo{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .22s}
.gaveta .painel{position:absolute;top:0;bottom:0;left:0;width:min(300px,calc(82vw / var(--z,1)));background:var(--card);border-right:1px solid var(--bd);margin-left:-320px;visibility:hidden;transition:margin-left .25s ease,visibility 0s .25s;overflow-y:auto;padding:calc(12px + env(safe-area-inset-top)) 0 20px}
.gaveta.aberta{pointer-events:auto}
.gaveta.aberta .fundo{opacity:1}
.gaveta.aberta .painel{margin-left:0;visibility:visible;transition:margin-left .25s ease}
.gaveta .topo{display:flex;align-items:center;gap:12px;padding:8px 20px 16px;border-bottom:1px solid var(--bd);margin-bottom:6px;font-weight:700;font-size:17px}
.gaveta button.gi{display:flex;align-items:center;gap:16px;width:100%;height:52px;padding:0 20px;border:0;background:none;color:var(--tx);font-size:16px;text-align:left}
.gaveta button.gi svg{color:var(--tx2)}
.gaveta button.gi.on{background:var(--pri-l);color:var(--pri-tx);font-weight:600}
.gaveta button.gi.on svg{color:var(--pri-tx)}
.gaveta button.gs{display:flex;align-items:center;gap:14px;width:100%;height:46px;padding:0 20px 0 60px;border:0;background:none;color:var(--tx);font-size:15px;text-align:left;opacity:.9}
.gaveta button.gs svg{color:var(--tx2)}
.gaveta button.gs.on{color:var(--pri-tx);font-weight:600;opacity:1}
.gaveta .sv{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--pri-l);color:var(--pri-tx);display:flex;align-items:center;justify-content:center;flex:none}
.gaveta button.gi .sv svg{color:var(--pri-tx);transition:transform .25s}
.gaveta .sv.cutuca svg{animation:cutuca 2.6s ease-in-out infinite}
.gaveta .sv.aberta svg{transform:rotate(90deg)}
@keyframes cutuca{0%,60%,100%{transform:translateX(0)}70%{transform:translateX(5px)}78%{transform:translateX(0)}86%{transform:translateX(3px)}92%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.gaveta .sv.cutuca svg{animation:none}}
.gaveta .bdg{margin-left:auto;background:#E24B4A;color:#fff;border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:3px;padding:16px;margin-bottom:16px}
.big{font-size:26px;font-weight:700}
.lbl{font-size:13px;color:var(--tx2);margin-bottom:4px}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--bd)}
.row .grow,.grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--tx2);margin-top:2px}
.row.click:active,.card.click:active{background:var(--pri-l)}
.card.click{cursor:pointer}
.num{text-align:right;white-space:nowrap}
.num .t{font-weight:600}
.num .s{font-size:12px;color:var(--tx2)}
.bloco{background:var(--bg);border-radius:3px;padding:10px 12px}
.bloco .lbl{font-size:12px;margin-bottom:2px}
.bloco b{font-size:17px}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri-l);color:var(--pri-tx);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.dot{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--pri-l);color:var(--pri-tx);margin-left:4px;vertical-align:1px}
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-size:13px;color:var(--tx2);margin-bottom:5px}
input,select{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--inbd);border-radius:3px;background:var(--surf);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pri);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--inbd);background:var(--surf);color:var(--tx);border-radius:3px;padding:9px 14px;font-size:15px;display:flex;align-items:center;gap:7px}
.chip.on{background:var(--pri-l);border-color:var(--pri);color:var(--pri-tx);font-weight:600}
.chip.sug{border-style:dashed;border-color:var(--pri);color:var(--pri-tx)}
.fdfundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;display:flex;align-items:flex-end;justify-content:center}
.fdfolha{background:var(--card);color:var(--tx);width:100%;max-width:560px;border-radius:14px 14px 0 0;border-top:1px solid var(--bd);padding:8px 16px calc(14px + env(safe-area-inset-bottom));max-height:85%;overflow-y:auto;transform:translateY(30px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.fdfundo.aberta .fdfolha{transform:none;opacity:1}
.fdalca{width:40px;height:4px;border-radius:2px;background:var(--tx2);opacity:.5;margin:2px auto 12px}
.fdop{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);color:var(--tx);padding:14px 2px;font-size:16px;text-align:left}
.fdop.bad{color:var(--bad);border-bottom:0;border-top:1px solid var(--bd);margin-top:14px}
.dvl{gap:10px;cursor:pointer}.dvl .num{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dvl .pgdv{padding:4px 9px;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.fdfolha{transition:none}}
.corrot{font-size:14px;margin:2px 0 6px;min-height:20px}
.tons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;justify-items:center;max-width:280px}
.ints{display:flex;gap:8px;justify-content:space-between;max-width:280px;margin-top:10px;padding:8px;background:var(--bg);border-radius:8px}
.corb{width:36px;height:36px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);flex:none}
.corb.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tx)}
.corb.apaga{opacity:.4}
.catsug{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pri-l);border-radius:3px;padding:6px 6px 6px 10px;margin:6px 0 4px;font-size:14px}
.catsug .chip{margin:0}
#fDevChips .chip,#lParaChips .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.add{border-style:dashed;border-color:var(--pri);color:var(--pri-tx);font-weight:600}
.seg{display:flex;border:1px solid var(--inbd);border-radius:3px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:var(--surf);color:var(--tx);padding:11px 6px;font-size:15px}
.seg button+button{border-left:1px solid var(--inbd)}
.seg button.on{background:var(--pri-l);color:var(--pri-tx);font-weight:600}
.btn{display:block;width:100%;border:0;border-radius:3px;padding:14px;font-size:16px;font-weight:600;background:var(--pri);color:#fff;margin-top:6px}
.btn.sec{background:var(--surf);color:var(--pri-tx);border:1px solid var(--pri)}
/* Ganhos: dois botões na mesma linha; com letra grande, quebram sozinhos em duas linhas */
.parbts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.parbts .btn{flex:1 1 130px;width:auto;margin:0;padding:11px 8px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ok2{background:var(--ok);color:#fff}
.parbts.tres .btn{flex-basis:80px;padding:10px 4px;font-size:14px}
html[data-tema=escuro] .btn.ok2,html[data-tema=black] .btn.ok2,html[data-tema=grafite] .btn.ok2,html[data-tema=azul] .btn.ok2{color:#10180a}
.avisoruim{background:var(--bad-l);border:1px solid var(--bad-bd);color:var(--bad);border-radius:3px;padding:9px 10px;font-size:14px;margin-bottom:12px}
.gvalor{font-size:30px!important;font-weight:700;text-align:center;color:var(--ok)}
.chip.ex{border-style:dotted;color:var(--tx2)}
.gdia{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.03em;margin:16px 2px 4px}
.gcols{display:flex;align-items:flex-end;gap:6px;height:84px;margin:12px 0 4px}
.gcols div{flex:1;background:var(--ok);border-radius:2px 2px 0 0;opacity:.75;min-height:2px}
.gcols div.prev{background:repeating-linear-gradient(45deg,var(--ok) 0 4px,transparent 4px 8px);border:1px dashed var(--ok);opacity:.6}
.gmeses{display:flex;gap:6px}.gmeses span{flex:1;text-align:center;font-size:11px;color:var(--tx2)}
.borra{filter:blur(6px);user-select:none}
/* Metas */
.opc.on{border:2px solid var(--pri);background:var(--pri-l)}
.opc small{display:block;color:var(--tx2);font-size:13px;font-weight:400}
.dicaok{background:var(--ok-l);border-radius:3px;padding:9px 10px;font-size:14px;margin-top:10px;color:var(--tx)}
/* Retrospectiva: cartões em tela cheia (toque à direita avança, à esquerda volta) */
.stories{position:fixed;inset:0;z-index:29;background:#000;display:flex;align-items:center;justify-content:center}
.story{position:relative;width:100%;max-width:440px;height:100%;max-height:calc(100vh / var(--z,1));color:#fff;padding:18px 20px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.story .sbarras{display:flex;gap:4px;margin:calc(env(safe-area-inset-top) + 4px) 40px 22px 0}.story .sbarras i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}.story .sbarras i.on{background:#fff}
.story .sfechar{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;background:none;border:0;color:#fff;padding:6px}
.story .sk{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.07em;margin-top:24px}
.story .sn{font-size:46px;font-weight:800;line-height:1.05;margin:10px 0;word-break:break-word}.story .sn.capa{font-size:52px;margin-top:22vh}.story .sn.menor{font-size:34px}
.story .stx{font-size:18px;line-height:1.4}
.story .slista{margin-top:16px;font-size:16px}.story .slista div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.2)}
.story .sgraf{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:22px}.story .sgraf i{flex:1;background:rgba(255,255,255,.45);border-radius:2px 2px 0 0}.story .sgraf i.top{background:#fff}.story .sgraf i.pior{background:#ffb4b4}
.story .smeses{display:flex;gap:4px;font-size:11px;opacity:.75;margin-top:4px}.story .smeses span{flex:1;text-align:center}
.story .srod{margin-top:auto;padding-top:12px;font-size:12px;opacity:.7}
.story .sbt{background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.story .scad{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:30px;background:rgba(20,18,40,.4)}
.s1{background:linear-gradient(160deg,#3C3489,#7F77DD)}.s2{background:linear-gradient(160deg,#1f5a10,#5c9a2b)}.s3{background:linear-gradient(160deg,#7a1f3d,#d4537e)}
.s4{background:linear-gradient(160deg,#0f4c6e,#378add)}.s5{background:linear-gradient(160deg,#6b4508,#d49a2a)}.s6{background:linear-gradient(160deg,#26215C,#534AB7)}
.retroimg{background:linear-gradient(160deg,#3C3489,#7F77DD);color:#fff;border-radius:3px;padding:14px;margin-top:10px}.retroimg .lbl{color:rgba(255,255,255,.85)}
.rconq{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.16);border-radius:3px;padding:8px 10px;margin-top:8px;font-size:14px}.rconq i{font-style:normal;font-weight:700;width:18px;text-align:center}
/* Domicash Pro */
.btn.ouro{background:linear-gradient(135deg,#E2B04A,#C88A1E);color:#1a1300}
/* quem tem o Pro (teste ou comprado): selo dourado no topo, contorno dourado no menu e no logo */
header .selotopo{flex:none;font-size:11px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:999px;color:#1a1300;background:linear-gradient(135deg,#F3D27A,#E2B04A 55%,#C88A1E);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
header.compro h1{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header.compro .selotopo{margin-right:auto}
header .hb.ouro{box-shadow:inset 0 0 0 2px #E2B04A}
.logopro{display:inline-flex;border-radius:50%;padding:2px;box-shadow:0 0 0 2px #E2B04A,0 0 10px rgba(226,176,74,.45)}
.gaveta .topo .subpro{display:block;font-size:12px;font-weight:600;color:#C88A1E;margin-top:1px}
.selopro{display:inline-flex;align-items:center;background:#E2B04A;color:#1a1300;font-size:10px;font-weight:800;padding:2px 6px;border-radius:3px;letter-spacing:.4px;vertical-align:middle;line-height:1.3}
.cadpro{display:inline-flex;color:#E2B04A;margin-left:5px;vertical-align:-2px}
.contgr{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px dashed rgba(226,176,74,.55);border-radius:12px;padding:9px 12px;margin:0 0 12px;color:var(--tx2);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.contgr>span:first-child{flex:none}.contgr .cbar{flex:1;height:6px;border-radius:4px;background:var(--bd);overflow:hidden;min-width:30px}.contgr .cbar i{display:block;height:100%;background:var(--ok)}
.blurpro{filter:blur(5px);user-select:none}
.assin{font-size:11.5px;color:var(--tx2);margin-top:6px}

/* Boas-vindas, tour e Guia */
/* boas-vindas: tamanhos acompanham a altura útil da tela (vh ÷ zoom do texto), sem regras por aparelho */
.bv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding:calc(clamp(10px,calc(5vh / var(--z,1)),30px) + env(safe-area-inset-top)) 24px calc(clamp(10px,calc(4vh / var(--z,1)),24px) + env(safe-area-inset-bottom));overflow-y:auto;scroll-padding:12px}
.bv .sl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(6px,calc(2vh / var(--z,1)),14px)}
.bv .ilu{width:clamp(56px,calc(20vh / var(--z,1)),120px);height:clamp(56px,calc(20vh / var(--z,1)),120px);border-radius:50%;background:var(--pri-l);color:var(--pri-tx);display:flex;align-items:center;justify-content:center;flex:none}
.bv .ilu svg{max-width:70%;max-height:70%}
.bv .bvt{font-size:22px;font-weight:700;margin:6px 0 0;line-height:1.25}
.bv p{color:var(--tx2);font-size:15px;line-height:1.5;margin:0;max-width:300px}
.bv .pts{display:flex;gap:6px;justify-content:center;margin:clamp(6px,calc(1.5vh / var(--z,1)),10px) 0 clamp(8px,calc(2.5vh / var(--z,1)),18px)}
.bv .pts i{width:8px;height:8px;border-radius:4px;background:var(--bd)}
.bv .pts i.on{width:22px;background:var(--pri)}
.bv .bvw{flex:1;display:flex;flex-direction:column;width:100%;max-width:460px;margin:0 auto;text-align:left}
.bv .bvw .bvt{margin:2px 0 4px}.bv .bvw p{margin:0 0 12px;color:var(--tx2);max-width:none}
.bv .bvps{font-size:13px;color:var(--tx2);display:flex;align-items:center;justify-content:space-between;min-height:34px}
.bv .bvvolta{background:none;border:0;color:var(--pri-tx);font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px;padding:6px 10px 6px 0}
.bv .bvdu .t{font-weight:700;margin-top:10px}.bv .bvdu .s{color:var(--tx2);font-size:14px;margin-top:2px}
.bv .card .row:last-child{border-bottom:0}
.bv .bvdu{margin-bottom:12px}.bv .bvdu ul{margin:6px 0 0;padding-left:20px;color:var(--tx2);font-size:14px}.bv .bvdu li{margin-bottom:3px}
.bv .bvhdr{background:var(--hdr);color:#fff;border-radius:3px;padding:10px 12px;display:flex;align-items:center;gap:10px}.bv .bvhdr b{flex:1}
.bv .bvq{display:flex;border-radius:50%;animation:pulsa 1.6s ease-out infinite}
.bv .bvmenu{display:flex;align-items:center;gap:12px;background:var(--pri-l);color:var(--pri-tx);border-radius:3px;padding:10px 12px}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
#ajudaBtn.pulsa{border-radius:50%;animation:pulsa 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.bv .bvq,#ajudaBtn.pulsa{animation:none;outline:2px solid #fff}}
.bv .bvbar{display:flex;gap:5px;margin:6px 0 18px}.bv .bvbar i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.bv .bvbar i.on{background:var(--pri)}
.bv .bvrod{display:flex;gap:8px;align-items:center;width:100%;max-width:460px;margin:0 auto;position:sticky;bottom:0;z-index:2;padding:22px 0 2px;background:linear-gradient(rgba(0,0,0,0),var(--bg) 20px)}.bv .bvrod .btn{flex:1;margin:0}
.bv .bvpl{background:none;border:0;color:var(--tx2);font-size:15px;padding:12px 14px;flex:none}
.bv~.mfundo:not(.sobre){z-index:65}
.bv .pular{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;background:none;border:0;color:var(--tx2);font-size:15px;padding:8px}
.tourfx{position:fixed;inset:0;z-index:70;pointer-events:auto}
.emtour .fab{transform:none!important;transition:none!important}
.tourfx .buraco{position:fixed;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:top .25s,left .25s,width .25s,height .25s;pointer-events:none}
.tourfx .buraco:after{content:'';position:absolute;inset:-4px;border-radius:9px;border:3px solid #9D96F0;animation:pulsoTour 1.6s ease-in-out infinite}
@keyframes pulsoTour{0%,100%{border-color:rgba(157,150,240,1);box-shadow:0 0 14px 2px rgba(157,150,240,.65)}50%{border-color:rgba(157,150,240,.12);box-shadow:0 0 0 0 rgba(157,150,240,0)}}
@media (prefers-reduced-motion:reduce){.tourfx .buraco:after{animation:none}}
.tourfx .balao{position:fixed;left:14px;background:var(--surf);color:var(--tx);border:1px solid var(--pri);border-radius:6px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;box-sizing:border-box}
.tourfx .balao .tx{overflow-y:auto;min-height:0;flex:1 1 auto;overscroll-behavior:contain}
.tourfx .balao .bts{flex:none}
.tourfx.compacto .balao{padding:10px 12px}
.tourfx.compacto .balao .tt{font-size:15px;margin-bottom:2px}
.tourfx.compacto .balao .tx{font-size:13px;line-height:1.35}
.tourfx.compacto .balao .bts{margin-top:8px}
.tourfx.compacto .exfaixa{top:calc(52px + env(safe-area-inset-top))}
.tourfx .balao .pp{font-size:12px;color:var(--pri-tx);font-weight:700;margin-bottom:4px}
.tourfx .balao .tt{font-weight:600;font-size:16px;margin-bottom:4px}
.tourfx .balao .tx{font-size:14px;color:var(--tx2);line-height:1.45}
.tourfx .balao .bts{display:flex;gap:8px;margin-top:12px;align-items:center}
.tourfx .balao .bts .pl{margin-right:auto;background:none;border:0;color:var(--tx2);font-size:14px;padding:6px 0}
.tourfx .exfaixa{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:2;background:#EF9F27;color:#2a1a00;font-size:12px;font-weight:700;padding:5px 12px;border-radius:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none}
.gprog{display:flex;align-items:center;gap:16px}
.gprog b{font-size:20px;display:block}
.mgr{margin-top:10px}
.mgr summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:3px;background:var(--surf);cursor:pointer}
.mgr summary::-webkit-details-marker{display:none}
.mgr summary .mt{font-size:15px;font-weight:600;flex:1}
.mgr summary .mbar{width:56px;height:5px;border-radius:3px;background:var(--bd);overflow:hidden}
.mgr summary .mbar i{display:block;height:100%;background:var(--ok)}
.mgr summary .mn{font-size:13px;color:var(--tx2);min-width:30px;text-align:right}
.mgr summary svg{color:var(--tx2);transition:transform .2s}
.mgr[open] summary svg{transform:rotate(180deg)}
.msec{margin:26px 2px 6px;display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--pri-tx);text-transform:uppercase;letter-spacing:.04em}
.mis{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bd)}
.mis:last-child{border-bottom:0}
.mis .ck{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--inbd);color:#fff}
.mis .ck.ok{background:var(--ok);border-color:var(--ok)}
.mis .ck.vi{background:var(--pri);border-color:var(--pri)}
.mis .grow{flex:1;min-width:0}
.mis .t{font-size:15px;font-weight:500}
.mis.ok .t{color:var(--tx2)}
.mis .s{font-size:12px;color:var(--tx2);margin-top:1px}
.nov{border:1px solid var(--bd);border-left:3px solid var(--pri);border-radius:0;background:var(--surf);padding:12px 14px;margin-top:10px}
.nov.lida{border-left-color:var(--bd)}
.nov .cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nov .cab b{font-size:15px}
.nov ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--tx2);line-height:1.5}
.novban{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--pri);border-radius:3px;background:var(--pri-l);color:var(--tx);padding:10px 12px;margin-bottom:12px;font-size:14px}
.novban .grow{flex:1}
/* Botão de Dúvida (?) e folha de ajuda da tela */
header .hb.ajuda{margin:-6px -4px -6px 0;flex:none}
.ajfolha,.mfundo,.mcaixa #mCorpo,.fdfolha,.gaveta .painel,.bv{overscroll-behavior:contain}
.ajfundo{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.5);opacity:0;transition:opacity .2s}
.ajfundo.on{opacity:1}
/* placar de pontualidade */
.placar .plc{display:flex;align-items:center;gap:14px;margin-top:10px}
.placar .anel{width:70px;height:70px;border-radius:50%;flex:none;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--bd) 0);display:flex;align-items:center;justify-content:center}
.placar .anel b{width:54px;height:54px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:21px}
.placar .tira{display:flex;gap:3px;margin-top:12px}.placar .tira i{flex:1;height:16px;display:block;position:relative;min-width:0}
.placar .tira i span{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:9px;color:var(--tx2);font-style:normal;overflow:hidden}
.placar .tleg{display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:20px;font-size:11px;color:var(--tx2)}.placar .tleg i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
/* uma informação por linha: rótulo à esquerda, valor à direita; com letra grande o valor desce sozinho */
.vl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.vl span{color:var(--tx2)}.vl i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}.vl b{margin-left:auto}
.limbar{height:10px;background:var(--bd);display:flex;margin:10px 0 4px;width:100%}.limbar i{display:block;height:100%}
/* cobrança pronta */
.bolha{background:var(--ok-l);border:1px solid var(--ok-bd);border-radius:10px 10px 2px 10px;padding:10px 12px;font-size:14px;line-height:1.45;white-space:pre-wrap;width:100%;min-height:150px;color:var(--tx);font-family:inherit;resize:vertical}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tg input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--pri)}
.ajfolha{position:fixed;left:0;right:0;bottom:0;z-index:56;max-height:calc(82vh / var(--z,1));overflow-y:auto;background:var(--bg);border-top:3px solid var(--pri);border-radius:14px 14px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s ease}
.ajfolha.on{transform:none}
.ajfolha .alca{width:40px;height:4px;border-radius:2px;background:var(--inbd);margin:4px auto 10px}
.ajfolha .cab{display:flex;align-items:center;gap:10px}
.ajfolha .cab .ic{width:38px;height:38px;border-radius:50%;background:var(--pri-l);color:var(--pri-tx);display:flex;align-items:center;justify-content:center;flex:none}
.ajfolha .cab b{font-size:17px;display:block}
.ajfolha .desc{font-size:14px;color:var(--tx2);line-height:1.5;margin:10px 0 4px}
.ajfolha .ajsec{margin:16px 2px 6px;font-size:12px;font-weight:700;color:var(--pri-tx);text-transform:uppercase;letter-spacing:.04em}
.faq{border:1px solid var(--bd);border-radius:3px;background:var(--surf);margin-top:6px}
.faq summary{list-style:none;padding:11px 12px;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary span{flex:1}
.faq[open] summary svg{transform:rotate(180deg)}
.faq div{padding:0 12px 12px;font-size:14px;color:var(--tx2);line-height:1.5}
header .ponto2{position:absolute;top:8px;left:7px;width:9px;height:9px;border-radius:50%;background:#7F77DD;border:2px solid var(--hdr)}
/* "Quando sobra salário" na vertical */
.ss .ano{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--pri-tx);margin:10px 0 2px}
.ss .ano:after{content:'';flex:1;height:1px;background:var(--bd)}
.ss .ln{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.ss .ln .m{color:var(--tx2)}
.ss .ln.hoje .m{color:var(--tx);font-weight:700}
.ss .tr{position:relative;height:12px;background:var(--bd);border-radius:2px}
.ss .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.ss .tr .t50{position:absolute;top:-3px;bottom:-3px;left:41.66%;border-left:1.5px dashed var(--tx2);opacity:.8}
.ss .tr .t100{position:absolute;top:-3px;bottom:-3px;left:83.33%;border-left:1.5px solid var(--tx2);opacity:.6}
.ss .tr .mais{position:absolute;right:-2px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#E24B4A}
.ss .vv{text-align:right;line-height:1.15;min-width:64px}
.ss .vv b{display:block;font-size:14px}
.ss .vv small{font-size:11px;color:var(--tx2)}
.ss .leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx2);margin:6px 0 4px}
.ss .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
/* Aparência: temas em pizza e barra superior */
.temas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 6px}
.tema{border:1px solid var(--bd);background:var(--surf);border-radius:3px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--tx)}
.tema.on{border:2px solid var(--pri);padding:7px 1px 5px;background:var(--pri-l)}
.tema .nm{font-size:12px;font-weight:600;text-align:center;line-height:1.15}
.legp{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--tx2);margin:6px 2px 4px}
.legp i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(128,128,128,.4)}
.barras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 6px}
.barraop{border:1px solid var(--bd);background:var(--surf);border-radius:3px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;color:var(--tx);font-size:13px;font-weight:600;align-items:stretch;text-align:center}
.barraop.on{border:2px solid var(--pri);padding:7px 5px;background:var(--pri-l)}
.barraop .mini-hdr{height:22px;border-radius:2px;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:10px;font-weight:600;border:1px solid var(--bd)}
.barraop .mini-hdr i{width:10px;height:2px;background:currentColor;display:block;box-shadow:0 -3px 0 currentColor,0 3px 0 currentColor}
/* Backup */
.bkst{display:flex;align-items:center;gap:12px}
.bkst .ic{width:40px;height:40px;border-radius:3px;background:var(--ok-l);color:var(--ok);display:flex;align-items:center;justify-content:center;flex:none}
.bkst .ic.off{background:var(--bd);color:var(--tx2)}
.bkst b{display:block;font-size:16px}
.arq{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.arq:last-child{border-bottom:0}
.arq .grow{flex:1;min-width:0}
.arq .t{font-size:15px;font-weight:500}
.arq .s{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis}
.arq .mini{padding:6px 9px}
.arq .tag{white-space:nowrap}
.gbk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.gbk .s{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.45}
.busca{position:relative;margin-bottom:6px}
.busca svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx2)}
.busca input{padding-left:40px}
.mfundo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:flex-start;justify-content:center;padding:calc(12vh / var(--z,1)) 14px 14px;overflow:auto}
.mcaixa{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:3px;padding:18px 16px 14px;width:100%;max-width:440px;display:flex;flex-direction:column;max-height:100%}
/* a janela cabe na tela (inclusive com o teclado aberto): o meio rola e os botões ficam sempre à vista */
.mcaixa #mCorpo{overflow-y:auto;min-height:0;flex:1 1 auto;margin:0 -4px;padding:0 4px}
.mcaixa .mbts,.mcaixa h3,.mcaixa #mErro{flex:none}
@media (max-height:620px){.mfundo{padding-top:8px;padding-bottom:8px}}
.mcaixa h3{margin:0 0 4px;font-size:18px}
.mbts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
/* os dois botões dividem a linha; com letra grande em tela pequena, quebram em duas linhas em vez de passar da borda */
.mbts .btn{margin-top:0;flex:1 1 120px;min-width:0;width:auto;overflow-wrap:anywhere}
.passo{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
.passo button{width:52px;height:52px;flex:none;border-radius:3px;border:1px solid var(--inbd);background:var(--surf);color:var(--tx);font-size:26px;line-height:1}
.passo input{text-align:center;font-size:24px;font-weight:700}
.lista{margin:10px 0 0;padding:0;list-style:none;font-size:14px}
.lista li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.lista li .grow{flex:1;min-width:0}
/* ===== v1.24: visual novo =====
   Padrões do Nubank (topo na cor escolhida abraçando o número principal, atalhos redondos, seções limpas, pílulas, folhas que sobem)
   com detalhes do Herói (anel de progresso, emojis nos atalhos, cartões que rolam, comemoração ao pagar). A cor do topo é a da
   "Cor do topo" em Aparência (verde do ícone por padrão). */
/* o topo fica sempre na "Cor do topo" (verde por padrão): os ícones do Android (hora, bateria) ficam brancos por cima dele */
header{background:var(--hdr);color:var(--hdrtx);padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:10px}
header button{color:var(--hdrtx)}
header h1{font-weight:800;font-size:19px}
header .hb{border-radius:50%}
body.vn-cor header{border-bottom-color:transparent}
body.vn-ini header h1{opacity:0}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.card{border:0;border-top:0;border-radius:20px;box-shadow:var(--sh)}
.card[style*="border-color"]{box-shadow:inset 0 0 0 1.5px var(--ok-bd),var(--sh)}
.bloco{border-radius:14px;background:var(--inbg)}
h2{text-transform:none;letter-spacing:0;font-size:17px;font-weight:800;color:var(--tx);margin:26px 2px 8px}
.h2l{margin:26px 2px 8px}
.tag{font-weight:700}
.av{font-weight:800}
.big{font-weight:800;letter-spacing:-.5px}
input,select,.campoesc,.valsel{border:1.5px solid transparent;background:var(--inbg);border-radius:14px}
input:focus,select:focus{outline:0;border-color:var(--pri);background:var(--card)}
input[type=checkbox],input[type=radio],input[type=range]{background:none;border:0}
.chip{border-radius:999px;border-color:transparent;background:var(--inbg);font-weight:600}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.qop{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--inbg);border:2px solid transparent;border-radius:14px;padding:12px 14px;margin-top:10px;color:var(--tx);font:inherit;font-size:15px}.qop.on{border-color:var(--pri)}.qop small{display:block;font-size:13px;color:var(--tx2)}.qin{padding:8px 2px 0}.qin .chip{max-width:100%;overflow-wrap:anywhere}.qq{opacity:.75;font-weight:400}
.chip.add,.chip.sug{border:1.5px dashed var(--pri);background:none}
.chip.ex{border:1.5px dotted var(--inbd);background:none}
.btn{border-radius:999px;font-weight:800;padding:14px 16px}
.btn.sec{background:var(--pri-l);border:0;color:var(--pri-tx)}
.bv .bvrod .btn{min-width:0;padding:13px 10px}
.mini,.ordb,.vermais{border-radius:999px;border-color:var(--bd)}
.seg{border:0;background:var(--inbg);border-radius:999px;padding:4px;gap:4px}
.seg button{background:none;border:0;border-radius:999px;color:var(--tx2)}
.seg button+button{border-left:0}
.seg button.on{background:var(--card);color:var(--pri-tx);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.gsel{border-radius:999px;background:var(--inbg)}.gsel button{border-radius:999px}
.opc,.tema,.barraop,.plano{border:0;border-radius:16px;background:var(--card);box-shadow:var(--sh),inset 0 0 0 1px var(--bd)}

function lerValor(t){
  const s=String(t).replace(/R\$|\s/gi,'');
  if(/^\d+([.,]\d{1,2})?$/.test(s))return parseFloat(s.replace(',','.'));
  if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));
  return NaN;
}

// Valor que ainda falta de uma dívida num mês (a parcela atual pode estar paga em parte)
function vMes(d,M,fim=Infinity){return cobraNoMes(d,M,fim)?(M===d.inicio?Math.max(0,d.valor-(d.parcial||0)):d.valor):0}
function cobraNoMes(d,m,fimRec){return d.recorrente?(m>=d.inicio&&m<=fimRec):(m>=d.inicio&&m<d.inicio+d.parcelas)}

function resumoDevedor(nome){
  const ds=ativas().filter(d=>d.devedor===nome);
  const total=ds.reduce((s,d)=>s+emAberto(d),0);
  const mensal=ds.filter(d=>d.recorrente).reduce((s,d)=>s+d.valor,0);
  const parc=ds.filter(d=>!d.recorrente);
  const fim=parc.length?Math.max(...parc.map(d=>d.inicio+d.parcelas-1)):null;
  return{ds,total,mensal,fim,ativo:ds.length>0};
}
function chaveSerie(d){return d.lojaId+(d.recorrente?'|r':'')}
function serieMensal(ds){
  if(!ds.length)return{meses:[],pilhas:[],chaves:[]};
  const ini=Math.min(...ds.map(d=>d.inicio));
  const recs=ds.filter(d=>d.recorrente);
  const fimRec=recs.length?Math.max(mesAtual(),...recs.map(d=>d.inicio))+MESES_FUTUROS_REC:-1;
  const fimParc=Math.max(-1,...ds.filter(d=>!d.recorrente).map(d=>d.inicio+d.parcelas-1));
  const fim=Math.max(fimRec,fimParc);
  const meses=[];for(let m=ini;m<=fim;m++)meses.push(m);
  const chaves=[...new Set(ds.map(chaveSerie))];
  const pilhas=meses.map(m=>{const p={};chaves.forEach(k=>p[k]=0);ds.forEach(d=>{p[chaveSerie(d)]+=vMes(d,m,fimRec)});return p});

// ---- Placar de pontualidade (0 a 100) ----
// Cada mês cobrado ganha uma nota pelo dia em que foi quitado (a data do "Recebido em"):
// até o vencimento 100 · 1–3 dias 85 · 4–7 dias 65 · 8–15 dias 45 · 16–30 dias 20 · mais de 30 ou vencido em aberto 0.
// Placar = média dos últimos 12 meses cobrados, com os 3 mais recentes valendo o dobro. Precisa de 3 meses.
const NOTAS_ATRASO=[[0,100],[3,85],[7,65],[15,45],[30,20]],PLACAR_MIN=3;
function notaAtraso(dias){for(const[l,n]of NOTAS_ATRASO)if(dias<=l)return n;return 0}
function corAtraso(x){return x.aberto||x.dias>15?'var(--bad)':x.dias<=0?'var(--ok)':x.dias<=3?'#C9A227':'#EF9F27'}
function faixaPlacar(n){return n>=90?['Excelente','var(--ok)']:n>=75?['Bom','var(--ok)']:n>=50?['Regular','var(--amb)']:['Atenção','var(--bad)']}
function placar(nome){
  const hoje=mesAtual(),ms={};
  (db.pagamentos||[]).forEach(p=>{if(p.dev!==nome||!(p.m<=hoje))return;
    if(p.parc&&db.dividas.some(d=>d.id===p.d&&d.parcial&&d.inicio===p.m))return;// pago só em parte: o mês ainda não conta
    const dias=Math.ceil((p.t-dataVenc(p.lj,p.m).getTime())/864e5),x=ms[p.m]||(ms[p.m]={m:p.m,dias:-999});x.dias=Math.max(x.dias,dias)});
  atrasosDe(nome).forEach(a=>{for(let k=0;k<a.meses;k++){const M=a.d.inicio+k;ms[M]={m:M,aberto:true}}});
  const lista=Object.values(ms).sort((a,b)=>a.m-b.m).slice(-12);
  lista.forEach(x=>x.nota=x.aberto?0:notaAtraso(x.dias));
  if(lista.length<PLACAR_MIN)return{lista,nota:null,falta:PLACAR_MIN-lista.length};
  let s=0,w=0;lista.forEach((x,i)=>{const p=i>=lista.length-3?2:1;s+=p*x.nota;w+=p});
  const pagos=lista.filter(x=>!x.aberto),media=pagos.length?Math.round(pagos.reduce((a,x)=>a+Math.max(-30,x.dias),0)/pagos.length):null;
  let seq=0;for(let i=lista.length-1;i>=0&&!lista[i].aberto&&lista[i].dias<=0;i--)seq++;
  return{lista,nota:Math.round(s/w),media,seq};
}

  if(!vivas.length)return{meses:0,pct:1,fim:null,marco:null,ativas:0,quitadas,parcPagas:pg,parcTot:tot};
  const m0=Math.min(...vivas.map(d=>d.inicio)),fim=Math.max(...vivas.map(d=>d.inicio+d.parcelas-1));
  // marco: o mês a partir do qual as contas ficam abaixo de 50% do salário DE VEZ

  const sal=db.salario||0;let marco=null;
  if(sal){const ini=mesAtual();let ult=-1;for(let m=ini;m<=fim;m++)if(contasDoMes(m).total>sal*.5)ult=m;marco=ult<0?ini:ult+1}
  return{meses:fim-Math.max(m0,mesAtual())+1,pct:tot?pg/tot:0,fim,marco,ativas:vivas.length,quitadas,parcPagas:pg,parcTot:tot};
}

// ---- Ganhos e rendas (grátis). O que entrou no mês = rendas fixas + rendas do ano daquele mês + ganhos anotados ----
// db.rendas: [{id,nome,v,tipo:'fixa',dia}|{id,nome,v,tipo:'ano',meses:[0..11]}]; db.ganhos: [{id,v,dt:'AAAA-MM-DD',tag,forma,obs,criado}]; db.tagsGanho: [nomes]
// db.salario continua existindo = soma das rendas fixas (as outras telas usam ele). Quem só tinha salário vira uma renda fixa "Salário".
const TAGS_EXEMPLO=['Venda','Freela','Comissão','Bico','Hora extra','Gorjeta','Presente','Reembolso','Aluguel recebido','Diária','Serviço','Aula particular','Revenda','Pensão','Bônus','Cashback'];
const FORMAS_GANHO=['Cartão','Dinheiro','Pix','Transferência'];
function mesDeISO(s){const[a,m]=String(s).split('-').map(Number);return a*12+m-1}
function ganhosLista(){return db.ganhos||[]}
function rendasFixas(){if(!db.rendas)return db.salario?[{id:'sal',nome:'Salário',v:db.salario,tipo:'fixa',dia:null}]:[];return db.rendas.filter(r=>r.tipo==='fixa')}
function rendasAno(){return(db.rendas||[]).filter(r=>r.tipo==='ano')}
function totFixas(){return r2(rendasFixas().reduce((s,r)=>s+r.v,0))}
function totAnoMes(M){return r2(rendasAno().filter(r=>(r.meses||[]).includes(M%12)).reduce((s,r)=>s+r.v,0))}
function ganhosDoMes(M){return ganhosLista().filter(g=>mesDeISO(g.dt)===M)}
function totGanhos(M){return r2(ganhosDoMes(M).reduce((s,g)=>s+g.v,0))}
// v1.25.3: a renda fixa nova vale a partir do mês em que foi cadastrada
function rendasFixasMes(M){return rendasFixas().filter(r=>r.desde==null||r.desde<=M)}
function entrouNoMes(M){const f=r2(rendasFixasMes(M).reduce((s,r)=>s+r.v,0)),a=totAnoMes(M),g=totGanhos(M);return{f,a,g,tot:r2(f+a+g)}}
function materializarRendas(){if(!db.rendas)db.rendas=rendasFixas().map(r=>({...r,id:r.id==='sal'?uid():r.id}))}
function sincSalario(){const t=totFixas();if(t>0)db.salario=t;else delete db.salario}
function tagsGanho(){return db.tagsGanho||[]}
function ultimoValorTag(t){const g=[...ganhosLista()].filter(x=>x.tag===t).sort((a,b)=>(b.criado||0)-(a.criado||0))[0];return g?g.v:null}
function embaralhar(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const vTxt=v=>v?num(v):'';

// Anotar ou editar um ganho

    ${ed?`<button type="button" class="mini" id="gApagar" style="margin-top:12px;color:var(--bad);border-color:var(--bad-bd)">${ic('trash',15)} Apagar este ganho</button>`:`<button type="button" class="btn sec" id="gOutro" style="margin-top:12px;padding:10px">Salvar e anotar outro</button>`}`,
    aoAbrir(){

        document.getElementById('gTags').innerHTML=chipsTag();ligar()});
        document.getElementById('gTagNova').onclick=()=>{tag='';document.getElementById('gTags').innerHTML=chipsTag();ligar();const bx=document.getElementById('gTagNBox');bx.style.display='block';document.getElementById('gTagN').focus()}};

// Extrato de ganhos do mês (com as rendas fixas e do ano daquele mês)
function telaGanhos(){
  const M=estado.mesG??(estado.mesG=mesAtual()),f=estado.filtroG||'',e=entrouNoMes(M);
  const gs=ganhosDoMes(M).sort((a,b)=>b.dt.localeCompare(a.dt)||(b.criado||0)-(a.criado||0));
  const tagsMes=[...new Set(gs.map(g=>g.tag).filter(Boolean))];const temFixa=e.f+e.a>0;
  const vis=f==='__fixas'?[]:gs.filter(g=>!f||g.tag===f);
  const totVis=f?(f==='__fixas'?r2(e.f+e.a):r2(vis.reduce((s,g)=>s+g.v,0))):e.tot;
  let h=`<div class="card"><div style="display:flex;align-items:center;gap:8px"><button class="mini" id="gAnt" aria-label="Mês anterior" style="border:0">${ic('left',20)}</button><div class="grow" style="text-align:center;font-weight:600">${MESES_LONGOS[M%12]} ${Math.floor(M/12)}</div><button class="mini" id="gProx" aria-label="Próximo mês" style="border:0">${ic('right',20)}</button></div>
  <div style="text-align:center;padding:10px 0 4px"><div style="font-size:34px;font-weight:700;color:var(--ok)">${brl(totVis)}</div><div class="lbl">${f?(f==='__fixas'?'rendas fixas e do ano':esc(f)):'entrou no mês'}${f==='__fixas'?'':` · ${vis.length} ganho${vis.length===1?'':'s'} anotado${vis.length===1?'':'s'}`}</div></div>
  ${tagsMes.length||temFixa?`<div class="chips" style="margin-top:8px"><button class="chip${!f?' on':''}" data-gf="">Todas</button>${tagsMes.map(t=>`<button class="chip${f===t?' on':''}" data-gf="${esc(t)}">${esc(t)}</button>`).join('')}${temFixa?`<button class="chip${f==='__fixas'?' on':''}" data-gf="__fixas">Fixas</button>`:''}</div>`:''}
  <div class="parbts"><button class="btn ok2" id="gNovo">${ic('plus',18)} Ganho</button><button class="btn sec" id="gRenda">Minha renda</button></div></div>`;
  // agrupado por dia
  const dias=[...new Set(vis.map(g=>g.dt))];
  dias.forEach(d=>{const doDia=vis.filter(g=>g.dt===d),[a,m,di]=d.split('-').map(Number),dt=new Date(a,m-1,di),hoje=d===hojeISO();
    h+=`<div class="gdia"><span>${hoje?'Hoje':['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][dt.getDay()]} · ${pad2(di)}/${pad2(m)}</span><span style="color:var(--ok)">${brl(r2(doDia.reduce((s,g)=>s+g.v,0)))}</span></div>
    <div class="card" style="padding:2px 14px">${gruposGanho(doDia).map(gr=>{const lin=g=>`<div class="row" data-gid="${g.id}" style="cursor:pointer"><div class="grow"><div class="t">${esc(g.tag||'Ganho')}</div><div class="s">${[g.forma,g.obs].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</div></div><b style="color:var(--ok);white-space:nowrap">+ ${num(g.v)}</b></div>`;
      // v1.25: ganhos iguais no mesmo dia (mesma tag, valor e forma) viram uma linha "4×"; toque para ver cada um
      return gr.length===1?lin(gr[0]):`<details class="gq"><summary class="row" style="cursor:pointer"><div class="grow"><div class="t"><span class="tag" style="margin:0 6px 0 0">${gr.length}×</span>${esc(gr[0].tag||'Ganho')}</div><div class="s">${gr.length} × ${num(gr[0].v)}${gr[0].forma?' · '+esc(gr[0].forma):''}</div></div><b style="color:var(--ok);white-space:nowrap">+ ${num(r2(gr.length*gr[0].v))}</b></summary>${gr.map(lin).join('')}</details>`}).join('')}</div>`});
  if((!f||f==='__fixas')&&temFixa){
    h+=`<div class="gdia"><span>Fixas e do ano</span><span style="color:var(--ok)">${brl(r2(e.f+e.a))}</span></div><div class="card" style="padding:2px 14px">`+
      [...rendasFixasMes(M),...rendasAno().filter(r=>(r.meses||[]).includes(M%12))].map(r=>`<div class="row" data-rid="${r.id}" style="cursor:pointer"><div class="grow"><div class="t">${esc(r.nome)}</div><div class="s">${r.tipo==='fixa'?(r.dia?`todo dia ${r.dia} · entra sozinho`:'todo mês · entra sozinho'):'renda do ano'}</div></div><b style="color:var(--ok);white-space:nowrap">+ ${num(r.v)}</b></div>`).join('')+`</div>`}
  if(!vis.length&&!temFixa)h+=`<div class="card"><div class="lbl" style="text-align:center;margin:0">Nenhum ganho anotado neste mês. Toque em <b>+ Ganho</b> sempre que receber algo: uma venda, um serviço, um bico.</div></div>`;
  h+=cardPrevisao(M);
  return h;
}
function gruposGanho(gs){const m=new Map();gs.forEach(g=>{const k=[g.tag||'',g.v,g.forma||''].join('|');if(!m.has(k))m.set(k,[]);m.get(k).push(g)});return[...m.values()]}
// Pro: ganhos por mês e previsão do próximo (no grátis, prévia borrada com os números da própria pessoa)
function cardPrevisao(M){
  const ref=Math.min(M,mesAtual()),meses=[ref-4,ref-3,ref-2,ref-1,ref],tots=meses.map(m=>entrouNoMes(m).tot);
  const base=[ref-3,ref-2,ref-1].map(m=>entrouNoMes(m).tot).filter(v=>v>0);if(!base.length){const at=entrouNoMes(ref).tot;if(!at)return'';base.push(at)}
  const media=r2(base.reduce((s,v)=>s+v,0)/base.length),prox=ref+1,prev=r2(Math.max(media,totFixas()+totAnoMes(prox))),contas=contasDoMes(prox).total,sob=r2(prev-contas);
  const mx=Math.max(...tots,prev,1),pro=temPro(),b=pro?'':' class="borra"';
  const porTag={};ganhosLista().filter(g=>g.tag&&mesDeISO(g.dt)>=ref-2&&mesDeISO(g.dt)<=ref).forEach(g=>porTag[g.tag]=(porTag[g.tag]||0)+g.v);
  const topo=Object.entries(porTag).sort((a,b)=>b[1]-a[1])[0];
  return`<h2>Previsão${cadPro()}</h2><div class="card"${attrPro('previsao')}>
  <div class="t">Quanto entrou por mês</div>
  <div class="gcols">${tots.map(v=>`<div style="height:${v/mx*100}%"></div>`).join('')}<div class="prev" style="height:${prev/mx*100}%"></div></div>
  <div class="gmeses">${meses.map(m=>`<span>${MESES[m%12].toLowerCase()}</span>`).join('')}<span>${MESES[prox%12].toLowerCase()}*</span></div>
  <div class="lbl" style="margin-top:10px">Média dos últimos meses: <b${b}>${brl(media)}</b></div>
  <div class="t" style="margin-top:12px">${MESES_LONGOS[prox%12]} (previsão)</div>
  <div class="grid2" style="margin-top:8px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><div class="bloco"><div class="lbl">Deve entrar</div><b${b} style="color:var(--ok);overflow-wrap:anywhere">${brl(prev)}</b></div><div class="bloco"><div class="lbl">Contas</div><b style="overflow-wrap:anywhere">${brl(contas)}</b></div></div>
  <div class="lbl" style="margin-top:10px">Deve ${sob>=0?'sobrar':'faltar'} <b${b} style="color:${sob>=0?'var(--ok)':'var(--bad)'}">${brl(Math.abs(sob))}</b>${topo?` · a tag que mais rendeu foi <b${b}>${esc(topo[0])}</b>`:''}</div>
  ${pro?'':`<button class="btn" style="margin-top:12px;background:linear-gradient(135deg,#f3d27a,#c9962e);color:#2a1d00">Ver a previsão com o Pro</button>`}</div>`;
}
function ligarGanhos(){
  document.getElementById('gAnt').onclick=()=>{estado.mesG--;render()};

// Minha renda: rendas fixas, rendas do ano, a soma do mês e as tags
function telaRenda(){
  const M=estado.mesP??mesAtual(),e=entrouNoMes(M),lin=(r,s)=>`<div class="row" data-rid="${r.id}" style="cursor:pointer"><div class="grow"><div class="t">${esc(r.nome)}</div><div class="s">${s}</div></div><b style="color:var(--ok);white-space:nowrap">${brl(r.v)}</b></div>`;
  const nomesMes=ms=>ms.length===12?'todos os meses':ms.slice().sort((a,b)=>a-b).map(m=>MESES_LONGOS[m].toLowerCase()).join(', ').replace(/, ([^,]*)$/,' e $1');
  return`<div class="card"><div class="t" style="font-size:16px">Rendas fixas</div><div class="lbl">Entram sozinhas todo mês. Ex.: salário, aposentadoria, aluguel recebido.</div>
    ${rendasFixas().map(r=>lin(r,r.dia?`dia ${r.dia}`:'todo mês')).join('')||'<div class="lbl" style="margin:8px 0">Nenhuma ainda.</div>'}
    <button class="btn sec" id="rFixa" style="padding:11px">${ic('plus',16)} Renda fixa</button></div>
  <div class="card"><div class="t" style="font-size:16px">Rendas do ano</div><div class="lbl">Entram só nos meses marcados. Ex.: 13º, férias, restituição.</div>
    ${rendasAno().map(r=>lin(r,nomesMes(r.meses||[]))).join('')||'<div class="lbl" style="margin:8px 0">Nenhuma ainda.</div>'}
    <button class="btn sec" id="rAno" style="padding:11px">${ic('plus',16)} Renda do ano</button></div>
  <div class="card"><div class="t" style="font-size:16px">${MESES_LONGOS[M%12]}: o que entrou</div>
    <div class="row" style="padding:8px 2px"><div class="grow">Rendas fixas</div><b>${brl(e.f)}</b></div>
    <div class="row" style="padding:8px 2px"><div class="grow">Rendas do ano</div><b>${brl(e.a)}</b></div>
    <div class="row" style="padding:8px 2px"><div class="grow">Ganhos anotados</div><b>${brl(e.g)}</b></div>
    <div class="row" style="padding:10px 2px;border-bottom:0;border-top:2px solid var(--bd)"><div class="grow"><b>Total que entrou</b></div><b style="color:var(--ok)">${brl(e.tot)}</b></div>
    <div class="lbl" style="margin:4px 0 0">É esse total que o app compara com as suas contas.</div></div>
  ${tagsGanho().length?`<div class="card"><div class="t" style="font-size:16px">Suas tags de ganho</div><div class="lbl">Toque para renomear ou apagar.</div><div class="chips" style="margin-top:8px">${[...tagsGanho()].sort(cmpAZ).map(t=>`<button class="chip" data-rtag="${esc(t)}">${esc(t)}</button>`).join('')}</div></div>`:''}`;
}
function ligarRenda(){
  document.getElementById('rFixa').onclick=()=>editarRenda('fixa');
  document.getElementById('rAno').onclick=()=>editarRenda('ano');
  document.querySelectorAll('#tela [data-rid]').forEach(r=>r.onclick=()=>{const x=[...rendasFixas(),...rendasAno()].find(y=>y.id===r.dataset.rid);if(x)editarRenda(x.tipo,x)});
  document.querySelectorAll('[data-rtag]').forEach(b=>b.onclick=()=>editarTag(b.dataset.rtag));
}
function editarRenda(tipo,r,cb){
  const ed=!!r;let ms=new Set(ed&&r.meses?r.meses:[]);
  abrirModal({titulo:(ed?'Editar ':'Nova ')+(tipo==='fixa'?'renda fixa':'renda do ano'),okTxt:'Salvar',
    corpo:`<label class="f" style="margin:10px 0 0"><span>Nome</span><input id="rN" maxlength="30" placeholder="${tipo==='fixa'?'Ex.: Salário':'Ex.: 13º salário'}" value="${ed?esc(r.nome):''}" autocomplete="off"></label>
    <label class="f" style="margin-top:8px"><span>Valor (R$)</span><input id="rV" inputmode="numeric" data-din placeholder="0,00" value="${ed?vTxt(r.v):''}"></label>
    ${tipo==='fixa'?`<label class="f" style="margin-top:8px"><span>Dia em que cai (opcional)</span><input id="rD" inputmode="numeric" maxlength="2" placeholder="Ex.: 5" value="${ed&&r.dia?r.dia:''}"></label>`
      :`<div class="lbl" style="margin-top:8px">Em quais meses entra</div><div class="chips" id="rMs" data-pede></div>`}
    ${ed?`<button type="button" class="mini" id="rApagar" style="margin-top:12px;color:var(--bad);border-color:var(--bad-bd)">${ic('trash',15)} Apagar esta renda</button>`:''}`,
    aoAbrir(){if(!ed)setTimeout(()=>{const e=document.getElementById('rN');if(e)e.focus()},60);
      // meses escolhidos viram etiquetas com ×; "+ mês" abre a roleta (v1.23)
      const desMs=()=>{const w=document.getElementById('rMs');if(!w)return;
        w.innerHTML=[...ms].sort((a,b)=>a-b).map(i=>`<button type="button" class="chip on" data-rm="${i}" aria-label="Tirar ${MESES_LONGOS[i].toLowerCase()}">${MESES_LONGOS[i].toLowerCase()} ×</button>`).join('')+`<button type="button" class="chip add" id="rMais">${ic('plus',14)} mês</button>`;
        w.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ms.delete(+b.dataset.rm);desMs()});
        document.getElementById('rMais').onclick=()=>{const prox=[...Array(12).keys()].find(i=>!ms.has(i)&&i>=new Date().getMonth())??[...Array(12).keys()].find(i=>!ms.has(i))??0;
          roda('Em que mês entra?',MESES_LONGOS.map((m,i)=>[i,m.toLowerCase(),ms.has(i)]),prox,i=>{ms.add(i);erroModal('');desMs()},{okTxt:'Adicionar',rodape:'Os já escolhidos aparecem com ✓.'})}};
      desMs();
      const ap=document.getElementById('rApagar');if(ap)ap.onclick=()=>perguntar(`Apagar ${r.nome}?`,'Ela deixa de entrar no mês. Dá para desfazer pelo Histórico.','Apagar',()=>{fecharModal();
        acao('renda',`Renda apagada: ${r.nome}`,{f:['rendas','salario']},()=>{materializarRendas();db.rendas=db.rendas.filter(x=>x.id!==r.id&&!(r.id==='sal'&&x.nome===r.nome&&x.v===r.v&&x.tipo==='fixa'));sincSalario()});
        salvar();render();toast('Renda apagada');if(cb)cb()})},
    aoOk(){const n=capitaliza(document.getElementById('rN').value.replace(/\s+/g,' '));if(!n){erroModal('Informe o nome');return false}
      const v=lerValor(document.getElementById('rV').value.trim());if(!(v>0)){erroModal('Valor inválido');return false}
      let dia=null;if(tipo==='fixa'){const d=document.getElementById('rD').value.trim();if(d){dia=parseInt(d,10);if(!(dia>=1&&dia<=31)){erroModal('Dia de 1 a 31');return false}}}
      else if(!ms.size){erroModal('Toque em "+ mês" e escolha ao menos um mês');return false}
      const novo=tipo==='fixa'?{id:ed&&r.id!=='sal'?r.id:uid(),nome:n,v:r2(v),tipo,dia,...(ed?(r.desde!=null?{desde:r.desde}:{}):{desde:mesAtual()})}:{id:ed?r.id:uid(),nome:n,v:r2(v),tipo,meses:[...ms].sort((a,b)=>a-b)};
      acao('renda',`${ed?'Renda editada':'Renda nova'}: ${n} · ${brl(novo.v)}`,{f:['rendas','salario']},()=>{const eraSal=ed&&r.id==='sal';materializarRendas();
        if(ed){const i=db.rendas.findIndex(x=>x.id===r.id||(eraSal&&x.tipo==='fixa'&&x.nome===r.nome));if(i>=0)db.rendas[i]=novo;else db.rendas.push(novo)}else db.rendas.push(novo);sincSalario()});
      salvar();render();toast('Renda salva');if(cb)cb()}});
}
function editarTag(t){
  abrirModal({titulo:'Tag de ganho',okTxt:'Salvar',
    corpo:`<label class="f" style="margin:10px 0 0"><span>Nome</span><input id="tN" maxlength="25" value="${esc(t)}" autocomplete="off"></label>
    <div class="lbl">Renomear muda também os ganhos já anotados com ela.</div>
    <button type="button" class="mini" id="tApagar" style="margin-top:10px;color:var(--bad);border-color:var(--bad-bd)">${ic('trash',15)} Apagar a tag (os ganhos ficam, sem tag)</button>`,
    aoAbrir(){document.getElementById('tApagar').onclick=()=>{fecharModal();
      acao('ganho',`Tag apagada: ${t}`,{f:['ganhos','tagsGanho']},()=>{db.tagsGanho=tagsGanho().filter(x=>x!==t);db.ganhos=ganhosLista().map(g=>g.tag===t?{...g,tag:null}:g)});salvar();render();toast('Tag apagada')}},
    aoOk(){const n=capitaliza(document.getElementById('tN').value.replace(/\s+/g,' '));if(!n){erroModal('Informe o nome');return false}if(n===t)return;
      acao('ganho',`Tag renomeada: ${t} → ${n}`,{f:['ganhos','tagsGanho']},()=>{db.tagsGanho=[...new Set(tagsGanho().map(x=>x===t?n:x))];db.ganhos=ganhosLista().map(g=>g.tag===t?{...g,tag:n}:g)});salvar();render();toast('Tag renomeada')}});
}

// ---- Metas (META 02, aprovada em 18/11/2026): enxuta e automática ----
// db.metas: [{id,tipo:'juntar'|'ganho',nome,alvo,ate(mês),lanc:[{m,v,t,r?}],criado}]  r=1: resposta da pergunta do mês
// db.livre: {ate:mês} = "Quero antes" do card automático "Livre das parcelas"
// Grátis: 1 meta de juntar + o card "Livre das parcelas". Pro: metas sem limite, meta de ganho e "Quero antes".
function metasLista(){return db.metas||[]}
function guardadoMeta(x){return r2((x.lanc||[]).reduce((s,l)=>s+l.v,0))}
function respondeuMes(x,M){return(x.lanc||[]).some(l=>l.m===M&&l.r)}
function separadoNoMes(M){return r2(metasLista().reduce((s,x)=>s+(x.lanc||[]).filter(l=>l.m===M&&l.r&&l.v>0).reduce((a,l)=>a+l.v,0),0))}
function mediaGanhos(){const v=[1,2,3].map(k=>totGanhos(mesAtual()-k)).filter(x=>x>0);return v.length?r2(v.reduce((s,x)=>s+x,0)/v.length):0}
// quanto deve entrar num mês (passado: o que entrou; atual e futuros: fixas + do ano + média dos ganhos)
function entrouPrev(M){return M<mesAtual()?entrouNoMes(M).tot:r2(totFixas()+totAnoMes(M)+Math.max(M===mesAtual()?totGanhos(M):0,mediaGanhos()))}
function sobraLivre(M){return r2(entrouPrev(M)-contasDoMes(M).total)}
function sobraMediaProx(){const m=mesAtual();return r2([m,m+1,m+2].reduce((s,k)=>s+Math.max(0,sobraLivre(k)),0)/3)}
function mesBase(x){return respondeuMes(x,mesAtual())?mesAtual()+1:mesAtual()}
function porMesMeta(x){const falta=r2(x.alvo-guardadoMeta(x));if(falta<=0)return 0;const n=Math.max(1,(x.ate??mesAtual())-mesBase(x)+1);return Math.ceil(falta/n)}
function outrasPorMes(id){return metasLista().filter(x=>x.tipo==='juntar'&&x.id!==id&&guardadoMeta(x)<x.alvo).reduce((s,x)=>s+porMesMeta(x),0)}
// sugestão de data: até metade da sobra livre (descontando as outras metas)
// v1.23: até 20% da sobra (antes 50%, sugeria prazos apertados demais)
function sugerirAte(falta,id){const cap=Math.max(0,sobraMediaProx()-outrasPorMes(id));const por=Math.max(10,Math.round(cap*.2/10)*10||Math.ceil(falta/12));
  return{ate:mesAtual()+Math.min(60,Math.max(1,Math.ceil(falta/por)))-1,por:Math.ceil(falta/Math.min(60,Math.max(1,Math.ceil(falta/por))))}}
function diaPergunta(){const ds=rendasFixas().map(r=>r.dia).filter(Boolean);return ds.length?Math.min(28,Math.min(...ds)+1):1}
const mesNome=M=>MESES_LONGOS[M%12].toLowerCase();
const mesAno=M=>`${MESES[M%12].toLowerCase()}/${Math.floor(M/12)}`;
function fraseMeta(x){
  if(x.tipo==='ganho'){const M=mesAtual(),v=totGanhos(M),f=r2(x.alvo-v);if(f<=0)return`<span style="color:var(--ok)">Meta de ${mesNome(M)} batida!</span> Você já faturou ${brl(v)}.`;
    const h=new Date(),rest=new Date(h.getFullYear(),h.getMonth()+1,0).getDate()-h.getDate()+1;return`Faltam <b>${brl(f)}</b>: cerca de ${brl(Math.ceil(f/rest))} por dia até o fim do mês.`}
  const g=guardadoMeta(x),f=r2(x.alvo-g);if(f<=0)return`<span style="color:var(--ok)">Meta batida!</span> Você juntou ${brl(g)}.`;
  if(x.ate<mesBase(x))return`O prazo passou e faltam <b>${brl(f)}</b>. Toque para escolher uma nova data.`;
  const p=porMesMeta(x),M=mesBase(x),aperto=p>Math.max(0,sobraLivre(M));
  if(g<=0&&!respondeuMes(x,mesAtual()))return`Comece separando <b>${brl(p)}</b> em ${mesNome(M)}.`+(aperto?' <span style="color:#BA7517">Está apertado para a sua sobra.</span>':'');
  return(M>mesAtual()?`Este mês já foi. Em ${mesNome(M)}, separe <b>${brl(p)}</b>.`:`Separe <b>${brl(p)}</b> em ${mesNome(M)}.`)+(aperto?' <span style="color:#BA7517">Está apertado para a sua sobra.</span>':x.ate>M?' Você está no ritmo.':'');
}
function progMeta(x){return x.tipo==='ganho'?Math.min(1,totGanhos(mesAtual())/x.alvo):Math.min(1,Math.max(0,guardadoMeta(x)/x.alvo))}
function icoMeta(t){return t==='juntar'?ic('money',20):ic('flag',20)}
function barraMeta(p,cor){return`<div style="height:9px;border-radius:5px;background:var(--bd);overflow:hidden;margin:8px 0 4px"><div style="height:100%;width:${Math.round(p*100)}%;background:${cor};border-radius:5px"></div></div>`}
function cardMeta(x){const p=progMeta(x),cor=x.tipo==='ganho'?'#BA7517':'var(--ok)';
  const sub=x.tipo==='ganho'?`<b style="color:${cor}">${brl(totGanhos(mesAtual()))}</b> de ${brl(x.alvo)} em ${mesNome(mesAtual())}`:`<b style="color:${cor}">${brl(guardadoMeta(x))}</b> de ${brl(x.alvo)}${x.ate!=null?` · até ${mesAno(x.ate)}`:''}`;
  return`<div class="card" data-meta="${x.id}" style="cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><span style="color:${cor}">${icoMeta(x.tipo)}</span><div class="t grow" style="font-size:16px">${esc(x.nome)}</div></div>
  ${barraMeta(p,cor)}<div class="lbl" style="margin:0">${sub}</div><div style="font-size:14px;margin-top:6px">${fraseMeta(x)}</div>${x.reserva&&x.tipo==='juntar'?folegoHTML(x):''}</div>`}
// "Livre das parcelas": automático, para quem tem parcelas suas
function livreInfo(){
  const ds=ativas().filter(d=>ehEu(d.devedor)&&!d.recorrente&&d.parcelas>0);if(!ds.length)return null;
  const fim=Math.max(...ds.map(d=>d.inicio+d.parcelas-1)),ids=new Set(ds.map(d=>d.id));
  const pago=(db.pagamentos||[]).filter(p=>ids.has(p.d)).reduce((s,p)=>s+p.v,0),resta=ds.reduce((s,d)=>s+emAberto(d),0);
  return{ds,fim,pct:pago+resta?pago/(pago+resta):0}}
// parcelas que caem depois do mês T (precisam ser adiantadas para ficar livre em T), das que acabam por último
// valor de adiantar k parcelas: se chega até a que já foi paga em parte, só o que falta dela
function valorAdiantar(d,k){return r2(k*d.valor-(k>=d.parcelas?d.parcial||0:0))}
function parcelasDepois(T){const out=[];ativas().filter(d=>ehEu(d.devedor)&&!d.recorrente&&d.parcelas>0).forEach(d=>{const fim=d.inicio+d.parcelas-1,n=Math.max(0,Math.min(d.parcelas,fim-T));if(n)out.push({d,n,v:valorAdiantar(d,n)})});return out.sort((a,b)=>b.n-a.n||b.v-a.v)}
function adiantouNoMes(M){return(db.pagamentos||[]).some(p=>p.adi&&p.m===M&&ehEu(p.dev))}
function planoLivre(T){const ps=parcelasDepois(T),tot=r2(ps.reduce((s,x)=>s+x.v,0)),base=adiantouNoMes(mesAtual())&&T>mesAtual()?mesAtual()+1:mesAtual(),meses=Math.max(1,T-base+1),qtd=ps.reduce((s,x)=>s+x.n,0);return{ps,tot,meses,base,porMes:Math.ceil(tot/meses),qtd}}
function descParcelas(ps,max){const n=ps.reduce((s,x)=>s+x.n,0);if(ps.length===1)return`${max??n} parcela${(max??n)>1?'s':''} do ${esc(partes(ps[0].d).nome)}`;return`${max??n} parcela${(max??n)>1?'s':''}`}
function cardLivre(){
  const L=livreInfo();if(!L)return'';const alvo=db.livre&&db.livre.ate<L.fim&&db.livre.ate>=mesAtual()?db.livre.ate:null;
  let frase,bt='';
  if(alvo!=null){const p=planoLivre(alvo);
    if(!p.qtd)frase=`<span style="color:var(--ok)">No ritmo para ${mesNome(alvo)}.</span> Nada a adiantar agora.`;
    else{const k=Math.min(p.ps[0].n,Math.ceil(p.qtd/p.meses)),d=p.ps[0].d,txt=`adiante <b>${descParcelas(p.ps.slice(0,1),k)}</b> (${brl(valorAdiantar(d,k))})`;
      if(p.base>mesAtual())frase=`<span style="color:var(--ok)">Este mês já foi.</span> Em ${mesNome(p.base)}, ${txt}.`;
      else{frase=`Este mês: ${txt}.`;bt=`<button class="btn" id="lAdiantar" style="padding:10px;font-size:15px">Adiantar agora</button>`}}}
  else{frase=`Sem fazer nada, a última parcela é em <b>${mesAno(L.fim)}</b>.`;
    if(L.fim>mesAtual())bt=`<button class="btn sec" id="lAntes" style="padding:10px;font-size:15px"${attrPro('metas')}>Quero antes${cadPro()}</button>`}
  return`<div class="card" style="border:1px dashed var(--pri)"><div style="display:flex;align-items:center;gap:10px"><span style="color:var(--pri-tx)">${ic('flag',20)}</span><div class="grow"><div class="t" style="font-size:16px">Livre das parcelas${alvo!=null?` em ${mesNome(alvo)}`:''}</div><div class="lbl" style="margin:0">${alvo!=null?`hoje acaba em ${mesAno(L.fim)}`:'automático · vem da Sua jornada'}</div></div>${alvo!=null?`<button class="mini" id="lMudar" style="border:0;padding:4px 6px" aria-label="Mudar o mês">${ic('pencil',15)}</button>`:''}</div>
  ${barraMeta(L.pct,'var(--pri)')}<div style="font-size:14px;margin-top:6px">${frase}</div>${bt}</div>`}
function queroAntes(){
  const L=livreInfo();if(!L)return;const ops=[];for(let T=mesAtual();T<L.fim&&ops.length<12;T++)ops.push(T);
  const sob=Math.max(0,sobraMediaProx()-outrasPorMes(null));let sel=null;
  abrirModal({titulo:'Quero ficar livre em…',okTxt:'Definir',
    corpo:`<div class="lbl">Hoje acaba em <b>${MESES_LONGOS[L.fim%12].toLowerCase()} de ${Math.floor(L.fim/12)}</b> (${L.ds.reduce((s,d)=>s+d.parcelas,0)} parcelas abertas).</div>
    <div class="chips" style="margin-top:10px">${ops.map(T=>{const p=planoLivre(T),cabe=p.porMes<=sob||!sob;return`<button type="button" class="chip" data-livre="${T}" style="padding:7px 11px${cabe?'':';border-style:dashed;color:var(--tx2)'}">${MESES[T%12].toLowerCase()}${Math.floor(T/12)!==Math.floor(mesAtual()/12)?'/'+String(Math.floor(T/12)).slice(2):''}</button>`}).join('')}</div>
    <div id="lRes" class="lbl" style="margin-top:10px">Toque no mês que você quer.</div>`,
    aoAbrir(){document.querySelectorAll('[data-livre]').forEach(b=>b.onclick=()=>{sel=+b.dataset.livre;document.querySelectorAll('[data-livre]').forEach(x=>x.classList.toggle('on',x===b));
      const p=planoLivre(sel),pct=sob?Math.round(p.porMes/sob*100):null;
      document.getElementById('lRes').innerHTML=`<div style="background:var(--pri-l);color:var(--tx);border-radius:3px;padding:9px 10px;font-size:14px">Para ficar livre em <b>${mesNome(sel)}</b>, adiante <b>${brl(p.porMes)} por mês</b>${p.meses>1?` até ${mesNome(sel)}`:' este mês'}: ${descParcelas(p.ps)} no total.</div>${pct!=null?`<div class="lbl" style="margin-top:6px">Isso usa <b>${pct}%</b> da sua sobra${pct>100?' (não cabe: escolha um mês mais à frente)':''}.</div>`:''}`;erroModal('')})},
    aoOk(){if(sel==null){erroModal('Escolha um mês');return false}
      acao('meta',`Livre das parcelas em ${mesAno(sel)}`,{f:['livre']},()=>{db.livre={ate:sel}});salvar();render();toast(`Meta: livre das parcelas em ${mesNome(sel)}`)}});
}
// adianta a última parcela (antecipação): o fim da dívida chega 1 mês mais cedo e o valor conta como pago neste mês
function adiantarUltima(d,g){guardarEstado(g,d);const ja=d.parcelas===1?d.parcial||0:0,v=valorAdiantar(d,1);d.parcelas--;d.pagas=(d.pagas||0)+1;if(ja)delete d.parcial;// ja: o que já estava pago dela (para desfazer)
  (db.pagamentos||(db.pagamentos=[])).push({g,d:d.id,dev:d.devedor,lj:d.lojaId,nm:loja(d.lojaId).nome+(d.desc?' · '+d.desc:''),cat:categoria(d),m:mesAtual(),v,t:Date.now(),adi:1,...(ja?{ja}:{})})}
function adiantarAgora(){
  const T=db.livre&&db.livre.ate;if(T==null)return;const p=planoLivre(T);if(!p.qtd||p.base>mesAtual())return;const x=p.ps[0],k=Math.min(x.n,Math.ceil(p.qtd/p.meses));
  abrirModal({titulo:'Adiantar parcelas',okTxt:'Adiantei',

const mesDoT=t=>{const d=new Date(t);return d.getFullYear()*12+d.getMonth()};

function dadosAno(Y){

  const rec={};(db.pagamentos||[]).filter(p=>!ehEu(p.dev)&&mesDoT(p.t)>=ini&&mesDoT(p.t)<=fim).forEach(p=>rec[p.dev]=(rec[p.dev]||0)+p.v);

function cartoesAno(Y){

  const grupos=new Map();ps.forEach(p=>{const k=p.g||('t'+p.t);if(!grupos.has(k))grupos.set(k,[]);grupos.get(k).push(p)});
  const L=db.pagamentos,ord=gr=>L.lastIndexOf(gr[gr.length-1]);
  const lista=[...grupos.values()].sort((a,b)=>ord(b)-ord(a));
  const dt=t=>{const d=new Date(t);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
  let h=`<h2>${ehEu(nome)?'Pagamentos feitos':'Pagamentos recebidos'}</h2>`;
  h+=lista.slice(0,30).map(gr=>{const tot=gr.reduce((s,p)=>s+p.v,0);
    const porDiv=new Map();gr.forEach(p=>{const k=p.d;if(!porDiv.has(k))porDiv.set(k,{nm:p.nm||nomeDividaId(p.d),ms:[]});porDiv.get(k).ms.push(p)});
    const itens=[...porDiv.values()].map(x=>`${esc(x.nm)} <span style="color:var(--tx2)">(${x.ms.sort((a,b)=>a.m-b.m).map(p=>mesTxt(p.m,true)+(p.parc?` parcial ${num(p.v)}`:'')).join(', ')})</span>`).join('<br>');
    const g=gr[0].g,pode=g&&(logAcoes().some(a=>a.id===g&&!a.desfeito)||podeDesfazer(g));
    return`<div class="row" style="align-items:flex-start;flex-wrap:wrap"><div class="grow" style="font-size:14px"><div class="s" style="margin:0 0 2px">${dt(gr[0].t)}</div>${itens}</div><div class="num"><div class="t" style="color:var(--ok)">${num(tot)}</div></div>
    ${pode?`<div style="width:100%;display:flex;justify-content:flex-end;margin-top:6px"><button class="mini" data-desf="${g}">${ic('back',15)} Desfazer</button></div>`:''}</div>`}).join('');
  if(lista.length>30)h+=`<div class="lbl" style="padding:8px 0">+ ${lista.length-30} pagamentos mais antigos</div>`;
  return h;
}

function novaAcao(tipo,texto,toca={}){
  const a={id:uid(),t:Date.now(),tipo,texto,antes:{d:{},l:{},f:{}},pos:{d:{},l:{}}};
  (toca.d||[]).forEach(id=>{const i=db.dividas.findIndex(x=>x.id===id);a.antes.d[id]=i>=0?clonar(db.dividas[i]):null;if(i>=0)a.pos.d[id]=i});

function fecharAcao(a,novos){

function chavesAcao(a){if(a.dbAntes)return['*'];return[...Object.keys(a.antes.d).map(k=>'d:'+k),...Object.keys(a.antes.l).map(k=>'l:'+k),...Object.keys(a.antes.f).map(k=>'f:'+k)]}
// Ação + todas as ações posteriores que mexeram nos mesmos itens (em cadeia)
function cascata(id){
  const L=logAcoes().filter(a=>!a.desfeito&&a.tipo!=='undo'),i=L.findIndex(a=>a.id===id);if(i<0)return[];
  const K=new Set(chavesAcao(L[i])),res=[L[i]];
  for(let j=i+1;j<L.length;j++){const ks=chavesAcao(L[j]);if(K.has('*')||ks.includes('*')||ks.some(k=>K.has(k))){res.push(L[j]);ks.forEach(k=>K.add(k))}}
  return res}
function descAcao(a){
  if(a.tipo!=='pag')return a.texto;
  if(a.resumo)return a.resumo;
  const ps=(db.pagamentos||[]).filter(p=>p.g===a.id);if(!ps.length)return'Pagamento';
  const devs=[...new Set(ps.map(p=>p.dev))],tot=ps.reduce((s,p)=>s+p.v,0),nms=[...new Set(ps.map(p=>(p.nm||'').split(' · ').pop()))];
  return`${devs.length===1&&ehEu(devs[0])?'Você pagou':`${devs.join(', ')} pagou`} ${brl(tot)} · ${nms.slice(0,3).join(', ')}${nms.length>3?` e mais ${nms.length-3}`:''}`}
function desfazAviso(id){const c=cascata(id);if(c.length){aplicarDesfazer(c);render()}}
function aplicarDesfazer(lista){// lista em qualquer ordem: desfaz do mais novo para o mais antigo
  const L=logAcoes(),ord=a=>L.indexOf(a);
  lista.slice().sort((a,b)=>ord(b)-ord(a)).forEach(a=>{
    if(a.tipo==='pag')a.resumo=descAcao(a);
    if(a.dbAntes){const log=db.log;db=JSON.parse(a.dbAntes);db.log=log}
    else{
      const repor=(arr,id,v,p)=>{const i=arr.findIndex(x=>x.id===id);if(v===null){if(i>=0)arr.splice(i,1)}else if(i>=0)arr[i]=clonar(v);else arr.splice(p!==undefined?Math.min(p,arr.length):arr.length,0,clonar(v))};
      Object.entries(a.antes.d).forEach(([id,v])=>repor(db.dividas,id,v,a.pos&&a.pos.d[id]));
      Object.entries(a.antes.l).forEach(([id,v])=>repor(db.lojas,id,v,a.pos&&a.pos.l[id]));
      Object.entries(a.antes.f).forEach(([c,v])=>{if(v===undefined)delete db[c];else db[c]=clonar(v)});
      if(a.tipo==='pag')db.pagamentos=(db.pagamentos||[]).filter(p=>p.g!==a.id);
      if(a.pgs)a.pgs.forEach(([i,p])=>{const L=db.pagamentos||(db.pagamentos=[]);L.splice(Math.min(i,L.length),0,clonar(p))});
      if(a.sep)(db.pagamentos||[]).forEach(p=>{if(p.sep===a.id){p.dev=a.sep;delete p.sep}});
    }
    a.desfeito=Date.now()});
  (db.pagamentos||[]).forEach(p=>{const d=db.dividas.find(x=>x.id===p.d);if(d){p.dev=d.devedor;p.cat=d.cat||'Outros'}});// mantém o histórico coerente com as dívidas restauradas
  logAcoes().push({id:uid(),t:Date.now(),tipo:'undo',texto:`Desfeito: ${lista.length>1?`${lista.length} ações`:descAcao(lista[0])}`,antes:{d:{},l:{},f:{}}});
  salvar();
}

// Só dá para desfazer um registro se não houver pagamento mais novo nas mesmas dívidas
function soAdiantou(g){const ps=(db.pagamentos||[]).filter(p=>p.g===g);return!!ps.length&&ps.every(p=>p.adi)}
// adiantada (a última) e comum (a primeira) não dependem uma da outra, a não ser que a adiantada tenha fechado uma já paga em parte
function comuta(g,h){return soAdiantou(g)!==soAdiantou(h)&&!(db.pagamentos||[]).some(p=>p.ja&&(p.g===g||p.g===h))}
function podeDesfazer(g,gs=[g]){const L=db.pagamentos||[];let ult=-1;const ids=new Set();L.forEach((p,i)=>{if(p.g===g){ult=i;ids.add(p.d)}});if(ult<0)return false;
  return!L.some((p,i)=>i>ult&&!gs.includes(p.g)&&ids.has(p.d)&&!comuta(p.g,g))}
// a cópia do Histórico serve? Não, se levaria junto uma restauração de backup ou um pagamento do outro tipo
function copiaServe(g,gs){const c=cascata(g);return!!c.length&&c.every(a=>gs.includes(a.id)||!(a.dbAntes||a.tipo==='pag'&&comuta(a.id,g)))}
function desfazerPagamento(g,silencioso,soConta){// soConta: pelos pagamentos, sem a cópia
  if(!soConta&&logAcoes().some(a=>a.id===g&&!a.desfeito)){if(silencioso){aplicarDesfazer(cascata(g))}else desfazerComAviso([g],true);return}
  const ps=(db.pagamentos||[]).filter(p=>p.g===g);if(!ps.length)return;
  {const a=logAcoes().find(x=>x.id===g&&!x.desfeito),tx=descAcao(a||{id:g,tipo:'pag'});if(a){a.resumo=tx;a.desfeito=Date.now()}logAcoes().push({id:uid(),t:Date.now(),tipo:'undo',texto:`Desfeito: ${tx}`,antes:{d:{},l:{},f:{}}})}
  const s=SNAPS.get(g)||(db.snaps||{})[g];

let T_PG=0;// 0 = agora

function aplicarValor(d,valor,g){

// Distribui um valor recebido de uma pessoa: mês a mês (do mais antigo), e dentro do mês pela ordem de vencimento
function distribuir(nome,valor,g){
  const ds=ativas().filter(x=>x.devedor===nome).map(x=>g?x:{...x});
  let resto=r2(valor),k=0;const out=[];

function cpfValido(s){if(!/^\d{11}$/.test(s)||/^(\d)\1{10}$/.test(s))return false;const dv=n=>{let t=0;for(let i=0;i<n;i++)t+=+s[i]*(n+1-i);return t*10%11%10};return dv(9)===+s[9]&&dv(10)===+s[10]}

function chavePix(k){k=(k||'').trim();if(!k)return'';
  if(/@/.test(k)||/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();

    const L=lojaSel&&db.lojas.find(l=>l.id===lojaSel);return L&&L.venc?dataVenc(L.id,M):null};
  const ajustaIni=()=>{const di=$('iniDica');if(!di)return;const M0=mesAtual(),agora=Date.now();let tx='';
    if(!iniMexido){const v=vencDe(M0),M=v&&v.getTime()<agora?M0+1:M0;$('fIni').value=mesInput(M);

    else if(!ed){const M=inputMes($('fIni').value||mesInput(M0)),v=vencDe(M);
