  $('fIni').addEventListener('input',()=>{iniMexido=true;ajustaIni()});
  const val=()=>lerValor($('fVal').value);
  const parc=()=>{const s=$('fParc').value.trim();return/^\d+$/.test(s)?parseInt(s,10):NaN};
  const prev=()=>{if(!$('prev'))return;const v=val(),p=parc();
    if(rec){const sc=lojaSel===SC&&diaSc();$('prev').textContent=v>0?`${brl(v)} todo ${sc?'dia '+diaSc()+', por '+forma:'mês'}, a partir de ${mesTxt(inputMes($('fIni').value||mesInput(mesAtual())))}, até você encerrar`:'';return}
    $('prev').textContent=(v>0&&p>0&&$('fIni').value)?`Total: ${brl(v*p)} · termina em ${mesTxt(inputMes($('fIni').value)+p-1)}`:''};
  const modo=()=>{
    document.querySelectorAll('#fTipo button').forEach(b=>b.classList.toggle('on',(b.dataset.t==='rec')===rec));
    $('wParc').style.display=rec?'none':'';$('gValores').style.gridTemplateColumns=rec?'1fr':'1fr 1fr';
    $('lVal').textContent=rec?'Valor mensal (R$)':'Valor da parcela (R$)';
    $('lIni').textContent=rec?'Mês da próxima cobrança':'Mês da próxima parcela';
    $('fDesc').placeholder=rec?'Ex.: Netflix, Internet, Plano de celular':'Ex.: Empréstimo, Pix crédito';
    $('descOpc').textContent=rec?'(recomendado)':'(opcional)';
    $('fVal').placeholder=rec?'55,90':'245,00';if(!rec&&lojaSel===SC)lojaSel=null;desenharLojas()};
  document.querySelectorAll('#fTipo button').forEach(b=>b.onclick=()=>{rec=b.dataset.t==='rec';$('eParc').textContent='';modo()});
  ['fVal','fParc','fIni'].forEach(i=>$(i).oninput=()=>{$('eVal').textContent='';$('eParc').textContent='';prev()});
  modo();
  // Categoria: opcional, com sugestão (histórico + lista pronta) e atalho "Categoria: item"
  let catSel=ed?ed.cat||'':'',sug='';
  const desenharCats=()=>{
    // v1.23: ordem fixa (A–Z); a sugestão fica numa linha à parte, sem empurrar os botões
    const cats=todasCategorias();if(catSel&&!cats.includes(catSel))cats.push(catSel);
    CATS_BASE.forEach(c=>{if(!cats.some(x=>normTxt(x)===normTxt(c)))cats.push(c)});
    if(sug&&!cats.some(x=>normTxt(x)===normTxt(sug)))cats.push(sug);
    cats.sort(cmpAZ);
    const mostrarSug=sug&&sug!==catSel;
    $('fCat').innerHTML=cats.map(c=>`<button type="button" class="chip${c===catSel?' on':''}" data-cat="${esc(c)}">${c===catSel?ic('check',14)+' ':''}${esc(c)}</button>`).join('')+`<button type="button" class="chip" id="catNova">${ic('plus',14)} Nova</button>`;
    $('catSug').innerHTML=mostrarSug?`<span>✦ Sugestão: <b>${esc(sug)}</b></span><button type="button" class="chip sug" id="catUsar">Usar</button>`:'';$('catSug').style.display=mostrarSug?'':'none';
    const cu=$('catUsar');if(cu)cu.onclick=()=>{catSel=sug;desenharCats()};
    $('catDica').innerHTML=catSel?'Toque de novo para tirar a categoria.':'Sem categoria, entra em "Outros".';
    document.querySelectorAll('#fCat [data-cat]').forEach(b=>b.onclick=()=>{catSel=catSel===b.dataset.cat?'':b.dataset.cat;desenharCats()});
    $('catNova').onclick=()=>novaCategoria(n=>{catSel=n;desenharCats()});
  };
  const atualizarSug=()=>{sug=sugerirCategoria($('fDesc').value,ed&&ed.id);desenharCats()};
  $('fDesc').addEventListener('input',atualizarSug);
  $('fDesc').addEventListener('change',()=>{const s=separarPrefixo($('fDesc').value);if(s){$('fDesc').value=s.desc;catSel=todasCategorias().find(c=>normTxt(c)===normTxt(s.cat))||s.cat;atualizarSug()}});
  atualizarSug();
  const cc=$('cancelar');if(cc)cc.onclick=()=>{estado.editando=null;if(ehEu(ed.devedor))estado.aba='pessoal';else{estado.aba='devedores';estado.devedor=ed.devedor}render()};
  ligarPessoas($('fDev'),$('fDevChips'),{eu:true,titulo:'De quem é a dívida?',aoEscolher:()=>{$('eDev').textContent=''}});
  _novaIni=estado.prefill&&!ed?'simulação':novaTexto();// vindo do simulador, voltar também pergunta
  $('fDev').addEventListener('input',()=>{$('eDev').textContent=''});
  $('salvar').onclick=()=>{
    const dev=$('fDev').value.trim().replace(/\s+/g,' ');
    const exist=nomes().find(n=>n.toLowerCase()===dev.toLowerCase());
    const v=val(),p=parc(),ini=$('fIni').value;let ok=true;
    const e=(id,m)=>{$(id).textContent=m;if(m)ok=false};
    e('eDev',dev?'':'Informe o nome');e('eLoja',lojaSel?'':(rec?'Escolha um banco ou "Sem cartão"':'Escolha um banco ou loja'));e('eVal',v>0?'':'Valor inválido');
    if(lojaSel===SC)e('eDia',diaSc()?'':'Informe o dia (1 a 31)');
    const minParc=ed&&!ed.recorrente?0:1;
    if(!rec)e('eParc',(p>=minParc&&p<=360)?'':(p===0?'Informe pelo menos 1 parcela':'Número de parcelas inválido'));
    if(!ini){ok=false;toast('Informe o mês')}
    if(!ok)return;
    {const quem=exist||dev;if(!ehEu(quem)&&(!ed||ed.devedor!==quem)&&!ativas().some(d=>d.devedor===quem)&&passouLimite('dev')){avisoPro('ilimitado');return}}
    if(!exist&&_mesma!==normTxt(dev)&&mesmaPessoa(dev,velho=>{_mesma=normTxt(dev);if(velho)$('fDev').value=velho;$('salvar').click()}))return;_mesma='';
    let desc=$('fDesc').value.trim();const sp=separarPrefixo(desc);if(sp){desc=sp.desc;if(!catSel)catSel=todasCategorias().find(c=>normTxt(c)===normTxt(sp.cat))||sp.cat}
    let novaSc=null,lj=lojaSel;
    if(lojaSel===SC){const L=db.lojas.find(l=>l.sc&&l.forma===forma&&l.venc===diaSc());if(L)lj=L.id;else{novaSc={id:uid(),nome:`${forma} · dia ${diaSc()}`,cor:'#0F6E56',sc:true,forma,venc:diaSc(),fatura:false};lj=novaSc.id}}
    const criaSc=()=>{if(novaSc&&!db.lojas.some(l=>l.id===novaSc.id))db.lojas.push(novaSc)};
    const reg={devedor:exist||dev,lojaId:lj,desc,cat:catSel,valor:Math.round(v*100)/100,parcelas:rec?0:p,inicio:inputMes(ini),recorrente:rec};
    criaSc();const rot=`${partes({...reg}).nome} (${reg.devedor}) · ${rec?brl(reg.valor)+'/mês':reg.parcelas+'x de '+brl(reg.valor)}`;
    const nl=novaSc?[novaSc.id]:[];
    if(ed)acao('divida',`Dívida editada: ${rot}`,{d:[ed.id]},()=>{criaSc();Object.assign(ed,reg);if(rec)delete ed.encerrada;(db.pagamentos||[]).forEach(p=>{if(p.d===ed.id)p.cat=ed.cat||'Outros'});return{novos:{l:nl}}});
    else acao('divida',`Nova dívida: ${rot}`,{},()=>{criaSc();const nid=uid();db.dividas.push({id:nid,criado:Date.now(),...reg});return{novos:{d:[nid],l:nl}}});
    salvar();toast(ed?'Alterações salvas':'Dívida salva');estado.editando=null;estado.novoDev=null;estado.prefill=null;
    if(ehEu(reg.devedor)){estado.aba='pessoal';estado.devedor=null}else{estado.aba='devedores';estado.devedor=reg.devedor}render();
  };
}

function trocarCategoria(de,para){

// Limite usado do cartão: tudo o que ainda vai cair nas faturas que não venceram (da fatura aberta em diante).
// Parcelas de faturas já vencidas não contam: o banco já recebeu (mesmo que a pessoa ainda não tenha te pagado).
function usoCartao(l){const M0=mesAtual()+(dataVenc(l.id,mesAtual()).getTime()<Date.now()?1:0);let eu=0,out=0;
  ativas().filter(d=>d.lojaId===l.id).forEach(d=>{let v;
    if(d.recorrente)v=d.valor;
    else{const fim=d.inicio+d.parcelas-1;if(fim<M0)return;v=(fim-Math.max(d.inicio,M0)+1)*d.valor-(d.inicio>=M0?(d.parcial||0):0)}
    if(ehEu(d.devedor))eu+=v;else out+=v});
  return{eu:r2(eu),out:r2(out),usado:r2(eu+out)}}
function limiteHTML(l){if(!temPro())return'';if(!l.limite)return'';const u=usoCartao(l),L=l.limite,pc=u.usado/L,livre=r2(L-u.usado);
  const cor=livre<0?'var(--bad)':pc>.8?'var(--amb)':'var(--ok)';
  return`<div style="width:100%"><div class="limbar"><i style="width:${Math.min(100,u.eu/L*100)}%;background:var(--pri)"></i><i style="width:${Math.min(100,u.out/L*100)}%;background:#EF9F27"></i></div>
    <div class="lbl" style="margin:0 0 4px;color:${pc>.8?cor:'var(--tx2)'}">${pc>.8?ic('alert',13)+' ':''}${Math.round(pc*100)}% de ${brl(L)} em uso</div>
    <div class="vl"><span><i style="background:var(--pri)"></i>Meu</span><b>${brl(u.eu)}</b></div>
    <div class="vl"><span><i style="background:#EF9F27"></i>Dos outros</span><b>${brl(u.out)}</b></div>
    <div class="vl"><span><i style="background:var(--bd)"></i>${livre<0?'Passou do limite':'Livre'}</span><b style="color:${cor}">${brl(Math.abs(livre))}</b></div></div>`}
function telaLojas(){

        salvar();render();toast(s?`${l.nome}: vence dia ${s}`:'Salvo, sem vencimento')}})});

const LEM_COR='#EF9F27',FORMAS_LEM=['Boleto','Cartão','Dinheiro','Pix','Transferência'];
const pad2=n=>String(n).padStart(2,'0');
function chaveDia(M,d){return`${Math.floor(M/12)}-${pad2(M%12+1)}-${pad2(d)}`}
function hojeK(){const h=new Date();return`${h.getFullYear()}-${pad2(h.getMonth()+1)}-${pad2(h.getDate())}`}
function mesLem(k){return(+k.slice(0,4))*12+(+k.slice(5,7))-1}
function diaLem(l){return+l.data.slice(8,10)}
function dataLem(k){return new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8,10))}
function lems(){return db.agenda||(db.agenda=[])}
function lemsDoMes(M){return(db.agenda||[]).filter(l=>mesLem(l.data)===M).sort((a,b)=>a.data.localeCompare(b.data)||a.criado-b.criado)}
function lemAtrasado(l){return!l.pago&&l.data<hojeK()}
function irAgenda(M,d){estado.mesA=M;estado.diaA=d||null;ir('agenda')}
function telaAgenda(){
  const M=estado.mesA??(estado.mesA=mesAtual()),a=Math.floor(M/12),mi=M%12,dias=new Date(a,mi+1,0).getDate(),ini=new Date(a,mi,1).getDay();
  const its=lemsDoMes(M),sel=estado.diaA,f=estado.filA||'todos',hk=hojeK();
  const dtTxt=k=>dataLem(k).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'}).replace(/^./,c=>c.toUpperCase()).replace('.','');
  let h=`<div class="h2l" style="margin-top:4px"><h2>${MESES_LONGOS[mi]} ${a}</h2><div style="display:flex;gap:4px"><button class="mini" id="aAnt" style="border:0" aria-label="Mês anterior">${ic('left',18)}</button><button class="mini" id="aProx" style="border:0" aria-label="Próximo mês">${ic('right',18)}</button></div></div>
  <div class="cal">${['D','S','T','Q','Q','S','S'].map(x=>`<span class="wd">${x}</span>`).join('')}${'<span></span>'.repeat(ini)}`;
  for(let d=1;d<=dias;d++){const k=chaveDia(M,d),ds=its.filter(l=>l.data===k),pend=ds.some(l=>!l.pago),ok=ds.length&&ds.every(l=>l.pago);
    h+=`<button class="${ds.length?'tem':''}${sel===d?' sel':''}${k===hk?' hoje':''}" data-adia="${d}">${d}<span class="dots">${pend?`<i style="background:${ds.some(lemAtrasado)?'#E24B4A':LEM_COR}"></i>`:''}${ok?'<i style="background:var(--tx2)"></i>':''}</span></button>`}
  h+=`</div><div class="lbl" style="margin:6px 2px 0"><span style="color:${LEM_COR}">●</span> a pagar &nbsp; <span style="color:#E24B4A">●</span> atrasado &nbsp; <span style="color:var(--tx2)">●</span> pago</div>`;
  const atrs=lems().filter(lemAtrasado).filter(l=>mesLem(l.data)!==M);
  if(atrs.length)h+=`<button class="atr" id="aAtr">${ic('alert',20)}<span style="flex:1">${atrs.length} lembrete${atrs.length>1?'s':''} atrasado${atrs.length>1?'s':''} em outro mês</span>${ic('chevron',16)}</button>`;
  const pend=its.filter(l=>!l.pago),soma=pend.reduce((s,l)=>s+(l.valor||0),0),semV=pend.filter(l=>!l.valor).length;
  h+=`<div class="agres"><div><span class="lbl">A pagar</span><b>${brl(soma)}</b><span class="lbl">${pend.length} lembrete${pend.length!==1?'s':''}${semV?` · ${semV} sem valor`:''}</span></div><div><span class="lbl">Pagos</span><b>${its.length-pend.length} de ${its.length}</b><span class="lbl">neste mês</span></div></div>`;
  h+=`<div class="h2l" style="margin-top:20px"><h2>${sel?`Dia ${sel}`:'Lembretes do mês'}</h2>${sel?`<button class="mini" id="aTodos">Ver o mês todo</button>`:''}</div>
  <div class="chips" style="margin:6px 0 4px">${[['todos','Todos'],['pagar','A pagar'],['pagos','Pagos']].map(([k,n])=>`<button class="chip${f===k?' on':''}" data-afil="${k}" style="padding:6px 12px;font-size:14px">${n}</button>`).join('')}</div>`;
  let lista=sel?its.filter(l=>diaLem(l)===sel):its;
  lista=lista.filter(l=>f==='todos'||(f==='pagar'?!l.pago:l.pago));
  if(!lista.length)h+=`<div class="lbl" style="padding:14px 2px">${sel?`Nada marcado para o dia ${sel}.`:'Nenhum lembrete aqui.'} Toque no <b>+</b> para criar${sel?' neste dia':''}.</div>`;
  else{const dts=[...new Set(lista.map(l=>l.data))];
    h+=dts.map(k=>{const g=lista.filter(l=>l.data===k);
      return`<div style="display:flex;justify-content:space-between;margin:14px 2px 2px;font-weight:600;font-size:14px"><span>${dtTxt(k)}${k===hk?' · hoje':''}</span><span class="lbl" style="margin:0">${g.filter(l=>l.pago).length}/${g.length}</span></div>`+
      g.map(l=>{const info=[l.para?`<span>${ic('user',13)}${esc(l.para)}</span>`:'',l.forma?`<span>${ic('money',13)}${esc(l.forma)}</span>`:'',l.obs?`<span>${esc(l.obs)}</span>`:''].filter(Boolean).join('');

        <button class="valb" data-led="${l.id}">${l.valor?num(l.valor):'<span style="color:var(--tx2);font-weight:400">—</span>'}</button></div>`}).join('')}).join('')}
  h+=`<div class="lbl" style="margin-top:22px;line-height:1.5">${ic('bulb',14)} A Agenda é para pagamentos <b>únicos</b>. Contas que se repetem todo mês continuam em <b>Nova dívida</b>, com banco/cartão e categoria.</div>`;

}
function marcarLembrete(l,pago){acao('agenda',`${pago?'Agenda paga':'Agenda: voltou para a pagar'}: ${l.desc}${l.valor?' · '+brl(l.valor):''}`,{f:['agenda']},()=>{l.pago=pago;l.pagoEm=pago?Date.now():null});salvar()}
function ligarAgenda(){
  const manter=f=>{const y=scrollY;f();render();scrollTo(0,y)};
  document.getElementById('aAnt').onclick=()=>manter(()=>{estado.mesA--;estado.diaA=null});
  document.getElementById('aProx').onclick=()=>manter(()=>{estado.mesA++;estado.diaA=null});
  const t=document.getElementById('aTodos');if(t)t.onclick=()=>manter(()=>{estado.diaA=null});
  const at=document.getElementById('aAtr');if(at)at.onclick=()=>{const l=lems().filter(lemAtrasado).sort((a,b)=>a.data.localeCompare(b.data))[0];manter(()=>{estado.mesA=mesLem(l.data);estado.diaA=null;estado.filA='pagar'})};
  document.querySelectorAll('[data-adia]').forEach(b=>b.onclick=()=>{const d=+b.dataset.adia;manter(()=>{estado.diaA=estado.diaA===d?null:d})});
  document.querySelectorAll('[data-afil]').forEach(b=>b.onclick=()=>manter(()=>{estado.filA=b.dataset.afil}));
  document.querySelectorAll('[data-lck]').forEach(b=>b.onclick=()=>{const l=lems().find(x=>x.id===b.dataset.lck);if(!l)return;marcarLembrete(l,!l.pago);manter(()=>{});toast(l.pago?'Marcado como pago':'Voltou para a pagar')});
  document.querySelectorAll('[data-led]').forEach(b=>b.onclick=()=>{const l=lems().find(x=>x.id===b.dataset.led);if(l)formLembrete(l)});
}
function novoLembrete(){const M=estado.mesA??mesAtual(),dm=new Date(Math.floor(M/12),M%12+1,0).getDate(),d=estado.diaA||(M===mesAtual()?new Date().getDate():1);formLembrete(null,chaveDia(M,Math.min(d,dm)))}
function formLembrete(l,dataPadrao){
  const ed=!!l,paras=[...new Set([...lems().map(x=>x.para).filter(Boolean).reverse(),...nomes().filter(n=>!ehEu(n))])];
  let forma=l?l.forma:null;
  const opc='<span>(opcional)</span>';
  abrirModal({titulo:ed?'Editar lembrete':'Novo lembrete',okTxt:'Salvar',
    corpo:`<label class="f"><span>O que pagar</span><input id="lDesc" placeholder="Ex.: Pix para a esposa" value="${l?esc(l.desc):''}" autocomplete="off"></label>
    <div class="grid2"><label class="f"><span>Data</span><input id="lData" type="date" value="${l?l.data:dataPadrao}"></label>
    <label class="f"><span>Valor ${opc}</span><input id="lVal" inputmode="numeric" data-din placeholder="0,00" value="${l&&l.valor?l.valor.toFixed(2).replace('.',','):''}"></label></div>
    <label class="f"><span>Para quem ${opc}</span><input id="lPara" placeholder="Ex.: Mateus" value="${l&&l.para?esc(l.para):''}" autocomplete="off"></label>
    <div class="chips" id="lParaChips" style="margin:-6px 0 14px"></div>
    <div class="f" style="margin-bottom:14px"><span class="lbl" style="display:block">Como pagar ${opc}</span><div class="formas">${FORMAS_LEM.map(x=>`<button type="button" class="chip${forma===x?' on':''}" data-lforma="${x}">${x}</button>`).join('')}</div></div>
    <label class="f"><span>Observação ${opc}</span><input id="lObs" placeholder="Ex.: chave Pix no WhatsApp" value="${l&&l.obs?esc(l.obs):''}" autocomplete="off"></label>
    <label class="swl"><input type="checkbox" id="lAvisar" ${!l||l.avisar?'checked':''}> Avisar no celular</label>
    ${ed?`<div style="display:flex;justify-content:flex-end;margin-top:12px"><button type="button" class="mini bad" id="lExcluir">${ic('trash',15)} Apagar</button></div>`:''}`,
    aoAbrir(){const $=id=>document.getElementById(id);
      ligarPessoas($('lPara'),$('lParaChips'),{lista:paras,titulo:'Para quem?',aoEscolher:()=>erroModal('')});
      document.querySelectorAll('[data-lforma]').forEach(b=>b.onclick=()=>{forma=forma===b.dataset.lforma?null:b.dataset.lforma;document.querySelectorAll('[data-lforma]').forEach(x=>x.classList.toggle('on',x.dataset.lforma===forma))});
      ['lDesc','lPara','lVal','lData'].forEach(i=>$(i).oninput=()=>erroModal(''));
      if(!ed)setTimeout(()=>{const e=$('lDesc');if(e)e.focus()},60);
      const ex=$('lExcluir');if(ex)ex.onclick=()=>perguntar('Apagar lembrete?',`"${l.desc}" sai da Agenda. Dá para desfazer pelo Histórico.`,'Apagar',()=>{fecharModal();acao('agenda',`Lembrete apagado: ${l.desc}`,{f:['agenda']},()=>{db.agenda=lems().filter(x=>x.id!==l.id)});salvar();render();toast('Lembrete apagado')})},
    aoOk(){const $=id=>document.getElementById(id);
      const desc=$('lDesc').value.trim(),para=$('lPara').value.trim(),data=$('lData').value,vt=$('lVal').value.trim();
      if(!desc&&!para){erroModal('Diga o que pagar ou para quem.');return false}
      if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){erroModal('Escolha a data.');return false}
      const valor=vt?lerValor(vt):null;if(vt&&!(valor>0)){erroModal('Valor inválido. Ex.: 150 ou 150,00');return false}
      const dados={desc:desc||`Pagar ${para}`,para:para||null,data,valor,forma,obs:$('lObs').value.trim()||null,avisar:$('lAvisar').checked};
      lems();acao('agenda',`${ed?'Lembrete editado':'Lembrete novo'}: ${dados.desc}${valor?' · '+brl(valor):''}`,{f:['agenda']},()=>{if(ed)Object.assign(l,dados);else lems().push({id:'l'+uid(),criado:Date.now(),pago:false,pagoEm:null,...dados})});
      salvar();estado.mesA=mesLem(data);estado.diaA=estado.diaA?+data.slice(8,10):null;estado.aba='agenda';estado.devedor=null;render();toast(ed?'Lembrete atualizado':'Lembrete criado')}});
}

    <div style="flex:1"><span class="lbl" style="margin:0">Você já conhece</span><b>${p.n} de ${p.t} funções</b><span class="lbl" style="margin:0">${p.pct===100?'Concluído! Você domina o app.':'Toque em "Mostrar" para ver como funciona.'}</span></div></div>
    ${p.pct<100?`<button class="btn" id="gTour" style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px">${ic('player',18)} Continuar o tour</button>`:''}</div>`;
  const grupos=[...new Set(MISSOES.map(m=>m[1]))],primeiro=grupos.find(gr=>MISSOES.some(m=>m[1]===gr&&!estadoMis(m)));
  h+=grupos.map(gr=>{const ms=MISSOES.filter(m=>m[1]===gr),f=ms.filter(m=>estadoMis(m)).length,ab=_gAbertos[gr]??gr===primeiro;
    return`<details class="mgr" data-gr="${gr}"${ab?' open':''}><summary><span class="mt">${gr}</span><span class="mbar"><i style="width:${f/ms.length*100}%"></i></span><span class="mn">${f}/${ms.length}</span>${ic('down2',16)}</summary><div class="card" style="padding:2px 14px;margin-top:6px">${ms.map(m=>{const e=estadoMis(m);
      return`<div class="mis${e==='ok'?' ok':''}"><span class="ck ${e}">${e?ic('check',14):''}</span><div class="grow"><div class="t">${m[2]}${MODO_PRO&&MIS_PRO[m[0]]?' '+seloPro():''}</div><div class="s">${e==='ok'?'Feito':e==='vi'?'Visto no tour · falta fazer':m[3]}</div></div><button class="mini" data-mis="${m[0]}">Mostrar</button></div>`}).join('')}</div></details>`}).join('');
  const lida=guiaEstado().novLida;
  h+=`<div class="msec"><span>${ic('sparkle',14)} Novidades</span><span style="color:var(--tx2)">versão ${VERSAO_APP}</span></div>`;
  h+=NOVIDADES.slice(0,1).map(([v,d,t,its,aba],i)=>`<div class="nov${lida===VERSAO_APP||i>0?' lida':''}"><div class="cab"><b>v${v} · ${t}</b>${i===0&&lida!==VERSAO_APP?'<span class="tag" style="background:var(--pri-l);color:var(--pri-tx)">novo</span>':`<span class="lbl" style="margin:0">${d}</span>`}</div><ul>${its.map(x=>`<li>${x}</li>`).join('')}</ul>${aba?`<button class="mini" data-novir="${aba}" style="margin-top:8px">Ver ${ic('chevron',14)}</button>`:''}</div>`).join('');
  return h+`<div class="lbl" style="text-align:center;margin-top:16px">Domicash ${VERSAO_APP}</div>`+linksLegais();
}
function ligarGuia(){
  const t=document.getElementById('gTour');if(t)t.onclick=()=>iniciarTour(passosDe(MISSOES.filter(m=>!estadoMis(m))),'guia');
  document.querySelectorAll('details.mgr').forEach(d=>d.ontoggle=()=>{_gAbertos[d.dataset.gr]=d.open});
  document.querySelectorAll('[data-mis]').forEach(b=>b.onclick=()=>iniciarTour(passosDe(MISSOES.filter(m=>m[0]===b.dataset.mis)),'guia'));
  document.querySelectorAll('[data-novir]').forEach(b=>b.onclick=()=>{estado.aba=b.dataset.novir;render()});
  const o=guiaEstado();if(o.novLida!==VERSAO_APP){o.novLida=VERSAO_APP;guiaGravar(o);badgeGuia()}
}

// ---- Tour: escurece a tela, destaca o objeto com contorno que "respira" e trava a rolagem ----
// Posicionamento automático: tudo é medido na hora e REMEDIDO sempre que a tela muda de tamanho
// (girar o celular, tela dividida, dobrável, teclado, tamanho do texto) ou o próprio objeto muda.
// O balão tenta, nesta ordem: abaixo, acima, ao lado (telas largas/deitadas) e, por último, o maior espaço,
// com altura limitada e texto rolando por dentro — os botões ficam sempre visíveis.
// fx.dataset.pronto='1' quando o desenho terminou (usado pelas verificações automáticas).
function iniciarTour(passos,voltarPara){
  if(!passos.length||document.querySelector('.tourfx'))return;let i=0,el=null,p=null,tRel=0;
  const fx=document.createElement('div');fx.className='tourfx';document.body.appendChild(fx);
  if(!db.dividas.length)entrarExemplo();
  const RAIZ=document.documentElement;
  // trava a rolagem da página (o texto do balão ainda pode rolar por dentro)
  const trava=e=>{if(!(e.target.closest&&e.target.closest('.balao .tx')))e.preventDefault()};
  RAIZ.style.overflow='hidden';RAIZ.style.overscrollBehavior='none';// só no html: overflow no body quebraria a barra fixa (sticky)
  document.body.classList.add('emtour');// o botão + não se esconde durante o tour
  ['wheel','touchmove'].forEach(ev=>addEventListener(ev,trava,{passive:false}));
  const teclas=e=>{if(['ArrowUp','ArrowDown','PageUp','PageDown','Home','End',' '].includes(e.key))e.preventDefault()};addEventListener('keydown',teclas);
  // remedir ao mudar o tamanho da tela ou do objeto (com um pequeno atraso para juntar vários avisos)
  const remedir=()=>{clearTimeout(tRel);fx.dataset.pronto='';tRel=setTimeout(()=>{if(!fx.isConnected||!el)return;fx._ajustou=false;centraliza();setTimeout(desenha,60)},120)};
  let ultTam=innerWidth+'x'+innerHeight;
  const aoMudarTela=()=>{const t=innerWidth+'x'+innerHeight;if(t!==ultTam){ultTam=t;remedir()}};
  addEventListener('resize',aoMudarTela);if(window.visualViewport)visualViewport.addEventListener('resize',aoMudarTela);
  if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',remedir);
  const ro=window.ResizeObserver?new ResizeObserver(()=>{if(fx.dataset.pronto)remedir()}):null;
  const solta=()=>{clearTimeout(tRel);document.body.classList.remove('emtour');RAIZ.style.overflow='';RAIZ.style.overscrollBehavior='';
    ['wheel','touchmove'].forEach(ev=>removeEventListener(ev,trava));removeEventListener('keydown',teclas);
    removeEventListener('resize',aoMudarTela);if(window.visualViewport)visualViewport.removeEventListener('resize',aoMudarTela);
    if(screen.orientation&&screen.orientation.removeEventListener)screen.orientation.removeEventListener('change',remedir);if(ro)ro.disconnect()};
  // tour de função Pro para quem está no grátis: no fim, o convite para liberar os 30 dias
  const kPro=MODO_PRO&&estadoPro()==='gratis'?(passos.map(x=>MIS_PRO[x.mis]).find(Boolean)||null):null;
  const fim=()=>{solta();fx.remove();if(emExemplo())sairExemplo();estado.devedor=null;estado.aba=voltarPara||'inicio';_chTela=null;render();if(kPro)setTimeout(()=>avisoPro(kPro),350)};
  fx._fim=fim;
  const fixo=e=>e&&getComputedStyle(e).position==='fixed';
  // inline:'center' também traz para a vista o que está numa faixa que rola para o lado (atalhos do Início)
  const centraliza=()=>{if(el&&!fixo(el))el.scrollIntoView({block:'center',inline:'center'})};
  const desenha=()=>{
    if(!fx.isConnected)return;
    // tudo em "px da página" (já com o zoom do tamanho do texto): medidas da tela ÷ zoom
    const z=zoomTela(),H=innerHeight/z,W=innerWidth/z,b0=el?el.getBoundingClientRect():null,m=8,gap=10,pad=6;
    const r=b0?{top:b0.top/z,left:b0.left/z,width:b0.width/z,height:b0.height/z}:{top:H/2-30,left:W/2-30,width:60,height:60};
    // destaque limitado à área visível (objetos maiores que a tela)
    const topo=Math.max(4,r.top-pad),base=Math.min(H-4,r.top+r.height+pad),esq=Math.max(4,r.left-pad),dir=Math.min(W-4,r.left+r.width+pad);
    fx.classList.toggle('compacto',H<560);// telas baixas (celular deitado): balão mais enxuto
    fx.innerHTML=(emExemplo()?`<div class="exfaixa">${ic('sparkle',15)} Exemplo com dados fictícios · nada é salvo</div>`:'')+`<div class="buraco" style="top:${topo}px;left:${esq}px;width:${dir-esq}px;height:${Math.max(20,base-topo)}px"></div>
    <div class="balao" style="top:0;left:14px;width:${W-28}px;max-height:${H-2*m}px;visibility:hidden"><div class="pp">Passo ${i+1} de ${passos.length}${MODO_PRO&&estadoPro()==='gratis'&&MIS_PRO[p.mis]?' '+seloPro():''}</div><div class="tt">${p.tt}</div><div class="tx">${p.tx}</div>
    <div class="bts"><button class="pl" id="tPular">Pular tour</button>${i?'<button class="mini" id="tVolta">Voltar</button>':''}<button class="mini" id="tProx" style="background:var(--pri);color:#fff;border-color:var(--pri)">${i===passos.length-1?'Concluir':'Próximo'}</button></div></div>`;
    const bal=fx.querySelector('.balao'),alt=()=>bal.getBoundingClientRect().height/z;
    let bh=alt();const emb=H-base-gap-m,acima=topo-gap-m;
    // não cabe nem acima nem abaixo, mas cabe se o objeto subir: rola até ele ficar logo abaixo da barra e refaz (uma vez)
    const hdr=Math.max(0,document.querySelector('header').getBoundingClientRect().bottom/z);
    if(!fx._ajustou&&emb<bh&&acima<bh&&H-(base-topo)-hdr-2*gap-m>=bh&&el&&!fixo(el)){
      fx._ajustou=true;const sm=el.style.scrollMarginTop;el.style.scrollMarginTop=(hdr+pad+8)+'px';el.scrollIntoView({block:'start'});el.style.scrollMarginTop=sm;
      setTimeout(desenha,40);return}
    let top,left=14,larg=W-28;
    if(emb>=bh)top=base+gap;
    else if(acima>=bh)top=topo-gap-bh;
    else{
      // ao lado do objeto, se a tela for larga o bastante (celular deitado, tablet)
      const dirLivre=W-dir-gap-m,esqLivre=esq-gap-m,lado=Math.max(dirLivre,esqLivre);
      if(lado>=240){larg=Math.min(380,lado);left=dirLivre>=esqLivre?dir+gap:esq-gap-larg;bal.style.width=larg+'px';bh=alt();
        top=Math.max(m,Math.min(H-bh-m,topo))}
      else{// último recurso: o maior espaço, com o texto rolando por dentro
        const maior=Math.max(emb,acima);if(maior>=110){bal.style.maxHeight=maior+'px';bh=alt();top=emb>=acima?base+gap:topo-gap-bh}
        else{bal.style.maxHeight=Math.max(160,H*.55)+'px';bh=alt();top=H-bh-m}}
    }
    bal.style.left=left+'px';bal.style.width=larg+'px';bal.style.top=Math.max(m,Math.min(H-bh-m,top))+'px';bal.style.visibility='';
    fx._ajustou=false;
    fx.querySelector('#tPular').onclick=fim;
    const v=fx.querySelector('#tVolta');if(v)v.onclick=()=>{i--;mostra()};
    fx.querySelector('#tProx').onclick=()=>{const o=guiaEstado();if(!o.vistas.includes(p.mis)){o.vistas.push(p.mis);guiaGravar(o)}if(i<passos.length-1){i++;mostra()}else{fim();toast('Tour concluído')}};
    fx.dataset.pronto='1';
  };
  const mostra=()=>{
    fx.dataset.pronto='';p=passos[i];
    const dev=p.dev==='*'?(nomes().filter(n=>!ehEu(n)&&resumoDevedor(n).ativo)[0]||null):(p.dev||null);
    if(estado.aba!==p.aba||(estado.devedor||null)!==dev){estado.devedor=dev;estado.aba=p.aba;if(p.aba==='nova'){estado.editando=null;estado.novoDev=null;estado.prefill=null}render()}
    // sem o item nos dados da pessoa (ex.: ainda sem lembretes), usa o exemplo neste tour
    if(!document.querySelector(p.sel)&&!emExemplo()){entrarExemplo();render();if(!document.querySelector(p.sel)){sairExemplo();render()}}
    el=document.querySelector(p.sel)||document.querySelector('#tela > *');
    if(ro){ro.disconnect();ro.observe(RAIZ);if(el)ro.observe(el)}
    centraliza();fx._ajustou=false;setTimeout(desenha,120);
  };
  mostra();
}

// ---- Lembretes de vencimento (notificações locais do celular) ----
// Avisos recorrentes: o Android não "insiste" sozinho, então o app agenda a série inteira
// (dias antes → vencimento → dias de atraso, várias vezes ao dia) e refaz tudo a cada salvar().
// O que já foi pago sai da série. Janela de 40 dias e no máximo 400 avisos (o Android limita os alarmes por app).
const AV_PAD={antes:2,hora:9,repetir:4,ate:21,atraso:3};
function cfgLembretes(){const c=db.lembretes||{},b={...AV_PAD,...c,ativo:!!c.ativo};b.agenda={igual:true,...AV_PAD,antes:0,...(c.agenda||{})};return b}
function regraAgenda(c){return c.agenda.igual?c:c.agenda}
function horasDia(r){const hs=[r.hora];if(r.repetir)for(let x=r.hora+r.repetir;x<=r.ate;x+=r.repetir)hs.push(x);return hs}
function planoAvisos(r,venc){const out=[],hs=horasDia(r);
  for(let k=-r.antes;k<=r.atraso;k++){const d=new Date(venc);d.setDate(d.getDate()+k);out.push({d,k,hs:k>0?[r.hora]:hs})}
  return out}
function quandoTxt(k){return k<0?(k===-1?'vence amanhã':`vence em ${-k} dias`):k===0?'vence hoje':k===1?'venceu ontem':`venceu há ${k} dias`}

// Pendências de um banco no mês M: sua parte (item "pagar" do checklist) e quem cobrar
function pendenciasBanco(l,its,M){
  const meu=its.find(g=>g.tipo==='p'&&g.lj===l.id&&!g.feito);
  const cob=its.filter(g=>g.tipo==='r'&&!g.feito&&g.ds.some(d=>d.lojaId===l.id)).map(g=>[g.dev,g.ds.filter(d=>d.lojaId===l.id).reduce((s,d)=>s+vMes(d,M),0)]).filter(([,v])=>v>0.004);
  return{meu,cob,tem:!!meu||cob.length>0};
}
function textoBanco(p){const partes=[];if(p.meu)partes.push(`Suas contas: ${brl(p.meu.pend)}`);
  if(p.cob.length)partes.push('Cobrar: '+p.cob.map(([n,v])=>`${n} ${brl(v)}`).join(', '));return partes}
function textoLembrete(l){return[l.valor?brl(l.valor):'',l.para?'para '+l.para:'',l.forma||'',l.obs||''].filter(Boolean).join(' · ')||'Toque para ver na Agenda'}
function aindaPendente(x){
  if(x.t==='a'){const l=lems().find(z=>z.id===x.id);return!!l&&!l.pago}
  if(x.t==='b'){const l=db.lojas.find(z=>z.id===x.lj);return!!l&&pendenciasBanco(l,checklistMes(x.M),x.M).tem}
  if(x.t==='c')return checklistMes(x.M).some(g=>g.tipo==='r'&&g.dev===x.dev&&g.pend>0.004);
  if(x.t==='m'){const m=metasLista().find(z=>z.id===x.id);return!!m&&!respondeuMes(m,x.M)}
  return true}
function montarLembretes(){
  const c=cfgLembretes(),out=[],agora=Date.now(),lim=agora+40*864e5,m0=mesAtual();
  const add=(at,title,body,extra,tipo='pagar')=>{if(at<agora+60000||at>lim)return;out.push({title,body,largeBody:body,schedule:{at:new Date(at),allowWhileIdle:true},actionTypeId:tipo,extra})};
  // Dia de cobrar (Pro): no dia do vencimento, um aviso por pessoa, com "Cobrar agora" (abre a cobrança pronta)
  if(temPro()&&c.cobrar!==false)for(let M=m0;M<=m0+1;M++){const ano=Math.floor(M/12),mi=M%12;
    checklistMes(M).filter(g=>g.tipo==='r'&&g.dia&&g.pend>0.004).forEach(g=>add(new Date(ano,mi,g.dia,c.hora,0,0,0).getTime(),`Hoje é dia de cobrar ${g.dev}`,`${brl(g.pend)} · toque em "Cobrar agora" para enviar a mensagem pronta`,{t:'c',dev:g.dev,M},'cobrar'))}
  for(let M=m0-1;M<=m0+1;M++){const its=checklistMes(M),ano=Math.floor(M/12),mi=M%12;
    db.lojas.forEach(l=>{if(!l.venc)return;const p=pendenciasBanco(l,its,M);if(!p.tem)return;
      const dia=Math.min(l.venc,new Date(ano,mi+1,0).getDate()),txs=textoBanco(p);
      planoAvisos(c,new Date(ano,mi,dia)).forEach(x=>x.hs.forEach(hh=>{const at=new Date(x.d);at.setHours(hh,0,0,0);
        add(at.getTime(),`${l.sc?(p.meu&&p.meu.ds.length===1?partes(p.meu.ds[0]).nome:'Mensalidades por '+l.forma):l.nome} ${quandoTxt(x.k)} (dia ${dia}/${pad2(mi+1)})`,txs.join(' · '),p.meu?{t:'b',lj:l.id,M}:{t:'b',lj:l.id,M,dev:p.cob.length===1?p.cob[0][0]:null,ac:p.cob.length===1?'cobrar':'lembrar'},p.meu?'pagar':p.cob.length===1?'cobrar':'lembrar')}))})}
  // Metas de juntar: "Separou os R$ X deste mês?" no dia seguinte ao da renda fixa (grátis: só a 1ª meta)
  metasLista().filter(x=>x.tipo==='juntar'&&guardadoMeta(x)<x.alvo&&(temPro()||x===metasLista().find(y=>y.tipo==='juntar'))).forEach(x=>{for(let M=m0;M<=m0+1;M++){if(respondeuMes(x,M)||M>x.ate)continue;
    add(new Date(Math.floor(M/12),M%12,diaPergunta(),c.hora,0,0,0).getTime(),x.nome,`Separou os ${brl(porMesMeta(x))} deste mês?`,{t:'m',id:x.id,M},'meta')}});
  // v1.25: avisos automáticos (limite em 80% e ao passar, resumo da semana, pessoas atrasadas a cada 7 dias)
  if(c.limite!==false){const g=gastoPorCategoria(m0),L=db.limites||{},reg=db.limAvisos||(db.limAvisos={});
    Object.keys(L).forEach(cat=>{const v=g.get(cat)||0,p=L[cat]?v/L[cat]:0;[[1],[.8]].some(([f])=>{if(p<f)return false;const k=`${cat}|${m0}|${f}`;if(!reg[k])reg[k]=agora+90000;
      add(reg[k],`${cat} ${p>=1?'passou do limite':`em ${Math.round(p*100)}% do limite`}`,`${brl(v)} de ${brl(L[cat])} em ${mesNome(m0)}. Toque para ver para onde vai o dinheiro.`,{t:'lim'},'abrir');return true})})}
  if(c.semana!==false&&db.dividas.length){const h=new Date();for(let k=1;k<=14;k++){const d=new Date(h.getFullYear(),h.getMonth(),h.getDate()+k,c.hora,0,0,0);if(d.getDay()!==0)continue;
    const fim=new Date(d.getTime()+7*864e5),M=d.getFullYear()*12+d.getMonth(),its=checklistMes(M).filter(x=>!x.feito&&x.dia&&new Date(Math.floor(M/12),M%12,x.dia)>=d&&new Date(Math.floor(M/12),M%12,x.dia)<fim);
    const np=its.filter(x=>x.tipo==='p').length,nr=its.filter(x=>x.tipo==='r').length,lv=livreDoMes(M);
    add(d.getTime(),'Sua semana',`${np?`${np} conta${np>1?'s':''} para pagar`:'Nenhuma conta para pagar'}${nr?` e ${nr} cobrança${nr>1?'s':''}`:''} até o próximo domingo.${lv.renda?` Livre em ${mesNome(M)}: ${brl(lv.livre)}.`:''}`,{t:'sem'},'abrir')}}
  if(c.atrasados!==false)devedoresAtrasados().forEach(([nome,as])=>{const a=as.reduce((x,y)=>y.dias>x.dias?y:x),venc=dataVenc(a.d.lojaId,a.d.inicio),tot=r2(as.reduce((s,x)=>s+x.valor,0));
    for(let k=1;k<=12;k++){const at=new Date(venc);at.setDate(at.getDate()+7*k);at.setHours(Math.min(21,c.hora+1),0,0,0);if(at.getTime()<agora+60000)continue;
      add(at.getTime(),`${nome}: ${7*k} dias de atraso`,`${brl(tot)} em aberto. Toque em "Cobrar agora" para enviar a mensagem pronta.`,{t:'c',dev:nome,M:a.d.inicio,atr:1},'cobrar');break}});
  // Resumo do mês (dia 1º) e retrospectiva do ano (1º de janeiro)
  if(db.dividas.length||ganhosLista().length){const prox=m0+1,ano=Math.floor(prox/12),mi=prox%12;add(new Date(ano,mi,1,c.hora,0,0,0).getTime(),`Seu ${mesNome(m0)} está pronto`,'Quanto entrou, quanto pagou e quanto sobrou. Toque para ver.',{t:'rm'},'abrir');
    if(mi===0)add(new Date(ano,0,1,c.hora,30,0,0).getTime(),`Sua retrospectiva de ${ano-1} está pronta`,'Seu ano em cartões: o que pagou, quitou, recebeu e ganhou.',{t:'r'},'abrir')}
  const r=regraAgenda(c);
  lems().filter(l=>!l.pago&&l.avisar).forEach(l=>planoAvisos(r,dataLem(l.data)).forEach(x=>x.hs.forEach(hh=>{const at=new Date(x.d);at.setHours(hh,0,0,0);
    add(at.getTime(),`${l.desc} · ${quandoTxt(x.k)}`,textoLembrete(l),{t:'a',id:l.id})})));
  (db.adiados||[]).filter(z=>z.at>agora&&aindaPendente(z.extra)).forEach(z=>out.push({title:z.title,body:z.body,largeBody:z.body,schedule:{at:new Date(z.at),allowWhileIdle:true},actionTypeId:z.extra&&z.extra.ac||(z.extra&&z.extra.t==='c'?'cobrar':'pagar'),extra:z.extra}));
  return out.sort((a,b)=>a.schedule.at-b.schedule.at).slice(0,400).map((n,i)=>({...n,id:i+1}));
}
var _acoesOk=false;
async function agendarLembretes(){
  const LN=plugin('LocalNotifications');if(!LN||emExemplo())return;
  if(!_acoesOk){try{await LN.registerActionTypes({types:[{id:'pagar',actions:[{id:'pago',title:'Paguei'},{id:'adiar',title:'Adiar 1h'}]},{id:'cobrar',actions:[{id:'cobrar',title:'Cobrar agora'},{id:'adiar',title:'Adiar 1h'}]},{id:'lembrar',actions:[{id:'adiar',title:'Adiar 1h'}]},{id:'meta',actions:[{id:'sim',title:'Sim'},{id:'naodeu',title:'Não deu'}]},{id:'abrir',actions:[]}]})}catch(e){}_acoesOk=true}
  const ns=cfgLembretes().ativo?montarLembretes():[];// monta antes de apagar: se der erro, os avisos antigos continuam
  const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
  if(!cfgLembretes().ativo)return;
  if(ns.length)await LN.schedule({notifications:ns});
}
// Toque na notificação ou nos botões "Paguei" / "Adiar 1h". Espera o desbloqueio (digital) antes de agir.
function quandoDestravado(fn){const t=()=>document.getElementById('trava')?setTimeout(t,400):fn();t()}
function tratarAcaoAviso(acao,x,n){
  if(!x||!x.t)return;
  if(acao==='adiar'){db.adiados=(db.adiados||[]).filter(z=>z.at>Date.now());db.adiados.push({at:Date.now()+3600e3,title:n.title||'Domicash',body:n.body||'',extra:x});salvar();toast('Aviso adiado para daqui a 1 hora');return}
  if(x.t==='a'){const l=lems().find(z=>z.id===x.id);if(!l)return;
    if(acao==='pago'&&!l.pago){marcarLembrete(l,true);setTimeout(()=>toast(`Pago: ${l.desc}`),300)}
    irAgenda(mesLem(l.data),diaLem(l));return}
  if(x.t==='b'&&acao==='cobrar'&&x.dev&&nomes().includes(x.dev)){estado.aba='devedores';estado.devedor=x.dev;render();setTimeout(()=>cobrar(x.dev,{M:x.M}),350);return}
  if(x.t==='b'){estado.mesI=x.M;estado.diaSel=null;ir('inicio');if(acao==='pago')confirmarPagoBanco(x.lj,x.M)}
  if(x.t==='m'){const m=metasLista().find(z=>z.id===x.id);ir('metas');if(m&&x.M===mesAtual()&&!respondeuMes(m,x.M)){if(acao==='sim')responderMeta(m,'sim');else if(acao==='naodeu')responderMeta(m,'nao')}return}
  if(x.t==='r'){ir('retro');return}
  if(x.t==='rm'||x.t==='sem'){ir('inicio');return}
  if(x.t==='lim'){ir('pessoal');return}
  if(x.t==='c'){if(!nomes().includes(x.dev))return;estado.aba='devedores';estado.devedor=x.dev;render();if(acao==='cobrar'||!acao||acao==='tap')setTimeout(()=>cobrar(x.dev,x.atr?{}:{M:x.M}),350)}
}
function confirmarPagoBanco(lj,M){
  const g=checklistMes(M).find(z=>z.tipo==='p'&&z.lj===lj&&!z.feito);
  if(!g){toast('Não há conta sua a pagar neste banco. Veja o checklist.');return}
  darBaixa(g,M);
}
(function(){const LN=plugin('LocalNotifications');if(!LN)return;
  LN.addListener('localNotificationActionPerformed',ev=>{const n=ev.notification||{};quandoDestravado(()=>tratarAcaoAviso(ev.actionId,n.extra,n))})})();
async function ativarLembretes(){

}

  const u=await entrarGoogle();if(!u)return false;
  gravarConta(u);const fim=r=>{if(aoFim)aoFim(r);else render()};
  toast('Procurando backup no seu Drive…');let bk=null;
  try{bk=await ultimoBackupDrive()}

  if(!bk){toast('Conta conectada');if(temDadosLocais())backupAuto(true).catch(()=>{});fim('conectou');return true}

  if(JSON.stringify(bk.d,null,1)===JSON.stringify(db,null,1)){toast('Conta conectada. O Drive já tem estes mesmos dados.');fim('conectou');return true}

// Tenta o Drive. Devolve 'ok', 'cheio' (Drive sem espaço) ou 'pendente' (sem internet/outro erro: tenta de novo depois).
async function backupDrive(nome,txt,guarda){
  try{await drive.gravar(nome,txt);
    try{const l=(await drive.listar()).filter(a=>RX_BK.test(a.nome)).sort((a,b)=>b.nome.localeCompare(a.nome));for(const a of l.slice(guarda))await drive.apagar(a.id)}catch(e){}
    return'ok'}

var _bkRodando=false;
// Faz o backup em arquivo se estiver na hora (ou se forcar). Devolve {ok,nome,erro,drive}.
async function backupAuto(forcar){
  const P=pb(),c=cfgBackup();if(!P||(!c.ativo&&!forcar)||_bkRodando||emExemplo())return{ok:false};
  const est=estBackup(),txt=JSON.stringify(db,null,1),hs=hashTexto(txt);
  // Drive pendente (estava sem internet) tenta de novo mesmo sem mudança nos dados
  if(!forcar&&est.quando&&!est.drivePend&&(Date.now()-est.quando<c.freq*864e5-3600e3||est.hash===hs))return{ok:false};
  if(!db.dividas.length&&!(db.agenda||[]).length)return{ok:false};
  _bkRodando=true;
  try{
    const nome=nomeBackup(),dst=destinoBk();let uri=c.uri;
    const dr=dst!=='cel'?await backupDrive(nome,txt,c.guarda):null;
    if(dr==='cheio')setTimeout(()=>toast('Seu Google Drive está cheio. O backup foi salvo no celular.'),500);
    // celular: quando escolhido, ou sempre que o Drive falhou (nada se perde)
    if(dst!=='drive'||dr!=='ok'){
    try{await P.gravar({uri,nome,texto:txt})}
    catch(e){if(!uri)throw e;// pasta escolhida sumiu ou perdeu o acesso: volta ao padrão
      // guarda quando e por que voltou ao padrão, para mostrar na tela de Backup
      gravarCfgBackup({...c,uri:null,pastaNome:null,voltou:{quando:Date.now(),pasta:c.pastaNome||'pasta escolhida',motivo:String(e.message||e).slice(0,160)}});uri=null;await P.gravar({uri:null,nome,texto:txt});
      setTimeout(()=>toast('Sem acesso à pasta escolhida. Os backups voltaram para Documentos › Domicash.'),500)}
    try{const l=(await P.listar({uri})).arquivos.filter(a=>RX_BK.test(a.nome)).sort((a,b)=>b.nome.localeCompare(a.nome));
      for(const a of l.slice(cfgBackup().guarda))await P.apagar({uri,nome:a.nome})}catch(e){}
    }
    try{LS_.setItem(CHAVE_BK_EST,JSON.stringify({quando:Date.now(),hash:hs,nome,kb:Math.max(1,Math.round(txt.length/1024)),...(dr?{drive:dr,drivePend:dr==='pendente'}:{})}))}catch(e){}
    return{ok:true,nome,drive:dr};
  }catch(e){return{ok:false,erro:e.message||String(e)}}
  finally{_bkRodando=false}
}

// PDF mínimo, sem biblioteca: a imagem do resumo (JPEG) fatiada em páginas A4. Devolve o PDF como texto binário.
function pdfDeCanvas(cv){
  const A4W=595.28,A4H=841.89,margem=24,larg=A4W-margem*2,esc=larg/cv.width,altPag=Math.floor((A4H-margem*2)/esc);

  fatias.forEach((f,i)=>{
    const img=add(`<< /Type /XObject /Subtype /Image /Width ${f.w} /Height ${f.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${f.jpg.length} >>\nstream\n${f.jpg}\nendstream`);
    const hPt=f.h*esc,cont=`q ${larg.toFixed(2)} 0 0 ${hPt.toFixed(2)} ${margem} ${(A4H-margem-hPt).toFixed(2)} cm /Im${i} Do Q`;
    const ct=add(`<< /Length ${cont.length} >>\nstream\n${cont}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4W} ${A4H}] /Resources << /XObject << /Im${i} ${img} 0 R >> >> /Contents ${ct} 0 R >>`))});
  objs[0]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n';const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return out;
}
